<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrimônio 4ª RPM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1B2A4A;        /* azul PMMG */
    --ink-2:#4A5A78;
    --ink-3:#8A94A8;
    --line:#D6DAE3;
    --paper:#F3F5F8;
    --white:#FFFFFF;
    --red:#B3202E;        /* vermelho PMMG — apenas para pendência */
    --amber:#C98A1D;
    --green:#2F7D5B;
    --steel:#7C93B8;
    --font-head:"Bahnschrift","Segoe UI Semibold","Roboto Condensed","Arial Narrow",sans-serif;
    --font-body:"Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--font-body)}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ---------- cabeçalho ---------- */
  header{background:var(--ink);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  header h1{font:600 22px/1.1 var(--font-head);margin:0;letter-spacing:.01em}
  header h1 small{display:block;font:400 13px/1.3 var(--font-body);color:#B8C2D9;margin-top:3px}
  header .spacer{flex:1}
  .ref{font-size:13px;color:#B8C2D9}
  .ref b{color:#fff;font-weight:600}
  .btn{border:1px solid #6B7DA3;background:transparent;color:#fff;padding:7px 14px;border-radius:3px;font-size:13px}
  .btn:hover{background:#2A3C63}
  .btn.primary{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}
  .btn.primary:hover{background:#E6EAF2}

  nav.tabs{background:var(--white);border-bottom:1px solid var(--line);padding:0 28px;display:flex;gap:4px}
  nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:600 15px/1 var(--font-head);color:var(--ink-3)}
  nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  nav.tabs button .n{display:inline-block;margin-left:8px;font:500 12px/1 var(--font-body);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px 7px;color:var(--ink-2)}
  nav.tabs button .n.alert{background:#FBE9EB;border-color:#EAB3B8;color:var(--red)}

  main{padding:20px 28px 60px;max-width:1360px}

  /* ---------- estado vazio ---------- */
  .drop{border:2px dashed #AEB8CC;background:var(--white);border-radius:6px;padding:48px 32px;text-align:center;max-width:720px;margin:60px auto}
  .drop.over{border-color:var(--ink);background:#EEF2F9}
  .drop h2{font:600 24px/1.2 var(--font-head);margin:0 0 8px}
  .drop p{margin:6px 0;color:var(--ink-2)}
  .drop code{background:var(--paper);padding:2px 6px;border-radius:3px;font-size:13px}
  .drop .btn{margin-top:18px}
  .drop .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .drop .btn.primary:hover{background:#2A3C63}
  .files{margin-top:16px;font-size:13px;color:var(--ink-2)}
  .files span{display:inline-block;margin:3px 6px;padding:3px 8px;background:var(--paper);border-radius:3px}
  .files span.ok{color:var(--green)}
  .files span.err{color:var(--red)}

  /* ---------- senha ---------- */
  .lock{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:40px 36px;max-width:440px;margin:80px auto;text-align:center}
  .lock h2{font:600 22px/1.2 var(--font-head);margin:0 0 6px}
  .lock p{color:var(--ink-2);margin:0 0 20px;font-size:13px}
  .lock input{width:100%;border:1px solid var(--line);padding:10px 12px;border-radius:3px;font-size:15px;margin-bottom:10px}
  .lock .btn.primary{width:100%;background:var(--ink);color:#fff;border-color:var(--ink);padding:10px}
  .lock .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

  /* ---------- filtros ---------- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
  .filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
  .filters select,.filters input{border:1px solid var(--line);background:var(--white);padding:7px 9px;border-radius:3px;min-width:160px;font-size:13px}
  .filters input[type=search]{min-width:260px}
  .filters .clear{align-self:flex-end;border:0;background:none;color:var(--ink-2);text-decoration:underline;padding:8px 4px;font-size:13px}

  /* ---------- resumo ---------- */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--white);border:1px solid var(--line);border-radius:4px;margin-bottom:18px}
  .summary div{padding:14px 18px;border-right:1px solid var(--line)}
  .summary div:last-child{border-right:0}
  .summary .k{font-size:12px;color:var(--ink-2)}
  .summary .v{font:600 26px/1.1 var(--font-head);margin-top:4px;font-variant-numeric:tabular-nums}
  .summary .v.red{color:var(--red)}
  .summary .v.amber{color:var(--amber)}
  .summary .s{font-size:12px;color:var(--ink-3);margin-top:2px}

  /* ---------- gráfico por batalhão ---------- */
  .panel{background:var(--white);border:1px solid var(--line);border-radius:4px;margin-bottom:18px}
  .panel-h{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .panel-h h2{font:600 16px/1.2 var(--font-head);margin:0}
  .panel-h .hint{font-size:12px;color:var(--ink-3)}
  .panel-h .right{margin-left:auto;font-size:12px;color:var(--ink-2)}
  .bars{padding:14px 18px 6px}
  .bar-row{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:12px;padding:5px 0;cursor:pointer;border-radius:3px}
  .bar-row:hover{background:var(--paper)}
  .bar-row.sel{background:#EEF2F9}
  .bar-row .lbl{font:600 13px var(--font-head);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-row .lbl small{display:block;font:400 11px var(--font-body);color:var(--ink-3)}
  .bar{display:flex;height:22px;background:var(--paper);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%}
  .bar-row .tot{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;color:var(--ink-2)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;padding:8px 18px 14px;font-size:12px;color:var(--ink-2)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}

  /* ---------- tabelas ---------- */
  .tbl-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font:600 12px/1.2 var(--font-head);color:var(--ink-2);background:var(--paper);position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
  tfoot th{position:static;cursor:default;border-top:2px solid var(--ink-2);color:var(--ink)}
  th.sort-asc::after{content:" ▲";font-size:9px}
  th.sort-desc::after{content:" ▼";font-size:9px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#F7F9FC}
  td.mono{font-family:Consolas,"Courier New",monospace;font-size:12px;white-space:nowrap}
  .tag{display:inline-block;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:600;white-space:nowrap}
  .tag.uso{background:#E5EAF3;color:var(--ink)}
  .tag.estoq{background:#E8EEF7;color:#3E5A8A}
  .tag.pend{background:#FBE9EB;color:var(--red)}
  .tag.trans{background:#FBF1DE;color:#8A5E0D}
  .tag.other{background:#ECECEC;color:#555}
  .empty{padding:40px;text-align:center;color:var(--ink-3)}

  .pager{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
  .pager button{border:1px solid var(--line);background:var(--white);padding:5px 10px;border-radius:3px}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager .spacer{flex:1}

  .breadcrumb{font-size:13px;margin-bottom:12px;color:var(--ink-2)}
  .breadcrumb a{color:var(--ink);text-decoration:underline;cursor:pointer}
  .breadcrumb b{color:var(--ink)}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:900px){
    .grid-2{grid-template-columns:1fr}
    .bar-row{grid-template-columns:110px 1fr 70px}
    header,main,nav.tabs{padding-left:14px;padding-right:14px}
  }
  @media (prefers-reduced-motion:no-preference){
    .bar i{transition:width .35s ease}
  }
  @media print{
    header .btn,nav.tabs,.filters,.pager{display:none}
    body{background:#fff}
    .panel,.summary{break-inside:avoid}
  }
</style>
</head>
<body>

<header>
  <h1>Relatório da 4ª RPM<small>Mapa carga, guias não confirmadas, quadro de distribuição (QDL) e frota de drones</small></h1>
  <div class="spacer"></div>
  <div class="ref" id="ref"></div>
  <button class="btn" id="btnPrint" hidden onclick="window.print()">Imprimir</button>
  <button class="btn primary" id="btnLoad">Carregar planilhas</button>
  <input type="file" id="fileInput" accept=".xlsx,.xls" multiple hidden>
</header>

<nav class="tabs" id="tabs" hidden>
  <button role="tab" aria-selected="true" data-tab="mapa">Mapa carga <span class="n" id="nMapa">–</span></button>
  <button role="tab" aria-selected="false" data-tab="guias">Guias não confirmadas <span class="n" id="nGuias">–</span></button>
  <button role="tab" aria-selected="false" data-tab="qdl">QDL <span class="n" id="nQdl">–</span></button>
  <button role="tab" aria-selected="false" data-tab="drones">Drones <span class="n" id="nDrones">–</span></button>
</nav>

<main id="main"></main>

<script>
/* ============================================================
   Carregamento automático
   ------------------------------------------------------------
   1) Se a página estiver publicada em um servidor (intranet),
      ela procura os arquivos abaixo na pasta "dados/" ao lado
      do HTML e carrega sozinha. Salve a exportação de cada mês
      com esses nomes fixos.
   2) Se o HTML tiver dados embutidos (gerado por gerar_painel.py),
      eles são usados sem precisar de servidor.
   3) Caso contrário, aparece o botão "Carregar planilhas".
   ============================================================ */
const ARQUIVOS = [
  'dados/mapa-carga.xlsx',
  'dados/guias-nao-confirmadas.xlsx',
  'dados/qdl.xlsx',
  'dados/drones.xlsx'
];

/* ============================================================
   Estado
   ============================================================ */
const S = {
  mapa:null,   // {rows:[], ref:Date|null, file:string}
  guias:null,  // {rows:[], file:string}
  qdl:null,    // {rows:[], file:string}
  drones:null, // {rows:[], file:string}
  tab:'mapa',
  loaded:[],   // mensagens sobre arquivos lidos
  fonte:'',    // 'arquivo' | 'servidor' | 'embutido'
  geradoEm:null,
  f:{bat:'',unid:'',dest:'',mun:'',q:''},
  g:{bat:'',dest:'',q:''},
  q:{bat:'',grp:'arm',mun:''},
  d:{unid:'',q:''},
  drill:null,  // unidade em detalhe (mapa)
  sort:{mapaU:['valor','desc'],mapaI:['unid','asc'],guias:['destino','asc'],qdl:['mun','asc'],drones:['unid','asc']},
  page:1, per:50
};

const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmtN   = new Intl.NumberFormat('pt-BR');
const brl = v => fmtBRL.format(v||0);
const n   = v => fmtN.format(v||0);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================================================
   Leitura das planilhas
   ============================================================ */
function battalion(u){
  u = String(u||'');
  const r = u.match(/(\d+ BPM|\d+ CIA PM IND|EM4RPM|\d+ RPM)/);
  if(r){
    const k = r[1];
    if(k==='EM4RPM') return 'EM 4ª RPM';
    if(/^\d+ RPM$/.test(k)) return 'Órgãos 4ª RPM';
    return k.replace(/^(\d+) BPM$/,'$1º BPM').replace(/^(\d+) CIA PM IND$/,'$1ª Cia PM Ind');
  }
  if(/CAS\b|SAUDE/.test(u)) return 'Saúde (CAS)';
  return 'Outros';
}
function destClass(d){
  d=String(d||'');
  if(d==='EM USO') return 'uso';
  if(d==='ESTOCADO') return 'estoq';
  if(d.startsWith('EM PEND')) return 'pend';
  if(d==='EM TRANSITO') return 'trans';
  return 'other';
}
const DEST_COLOR = {uso:'#1B2A4A',estoq:'#7C93B8',pend:'#B3202E',trans:'#C98A1D',other:'#B9BEC9'};
const DEST_NAME  = {uso:'Em uso',estoq:'Estocado',pend:'Em pendência',trans:'Em trânsito',other:'Outros'};

function wbSheets(wb){
  return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true})}));
}
function findHeader(rows,mustHave){
  for(let i=0;i<Math.min(rows.length,20);i++){
    const r=rows[i]||[];
    if(mustHave.every(h=>r.some(c=>typeof c==='string' && c.trim()===h))) return i;
  }
  return -1;
}
function colIndex(header){
  const m={};
  header.forEach((h,i)=>{ if(typeof h==='string') m[h.trim()]=i; });
  return m;
}
function findRefDate(rows){
  for(let i=0;i<6;i++){
    for(const c of (rows[i]||[])){
      if(Object.prototype.toString.call(c)==='[object Date]') return c;
      if(typeof c==='number' && c>40000 && c<60000 && typeof XLSX!=='undefined'){ // serial Excel
        const d=XLSX.SSF.parse_date_code(c); return new Date(d.y,d.m-1,d.d);
      }
      if(typeof c==='string'){
        const d=toDate(c); if(d) return d;
        const m=c.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
      }
    }
  }
  return null;
}
function num(v){ if(v==null||v==='') return 0; if(typeof v==='number') return v; const s=String(v).replace(/\./g,'').replace(',','.'); const x=parseFloat(s); return isNaN(x)?0:x; }
function str(v){ return v==null?'':String(v).trim(); }

function parseMapa(rows,file){
  const hi=findHeader(rows,['Unidade Responsável','Número Patrimônio']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const pat=str(r[c['Número Patrimônio']]); if(!pat) continue;
    const unid=str(r[c['Unidade Responsável']]);
    out.push({
      pat, unid, bat:battalion(unid),
      cod:str(r[c['Código Unidade Responsável']]),
      elem:str(r[c['Código Elemento Item Despesa']]),
      tipo:str(r[c['Tipo Bem']]),
      mat:str(r[c['Material']]).replace(/\s*-\s*$/,''),
      dest:str(r[c['Destinação do Bem']]),
      marca:str(r[c['Marca']]), modelo:str(r[c['Modelo']]),
      serie:str(r[c['Número Série']]), placa:str(r[c['Placa']]),
      valor:num(r[c['Valor Bem']]),
      mun:str(r[c['Nome Município Unidade - Responsável']])
    });
  }
  return {rows:out, ref:findRefDate(rows), file};
}
function parseGuias(rows,file){
  const hi=findHeader(rows,['Unidade Destino','Número Patrimônio']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const pat=str(r[c['Número Patrimônio']]); if(!pat) continue;
    const destino=str(r[c['Unidade Destino']]);
    out.push({
      pat, mat:str(r[c['Material']]).replace(/\s*-\s*$/,''),
      origem:str(r[c['Nome Unidade - Proprietário']]),
      gerencial:str(r[c['Unidade Gerencial']]),
      doc:str(r[c['Documento Última Movimentação']]),
      dest:str(r[c['Destinação do Bem']]),
      elem:str(r[c['Código Elemento Item Despesa']]),
      placa:str(r[c['Placa']]),
      destino, bat:battalion(destino),
      codDestino:str(r[c['Destino']]),
      valor:num(r[c['Valor Bem']])
    });
  }
  return {rows:out, file};
}

/* ---- QDL: uma linha por unidade x município ---- */
const QDL_GROUPS={
  arm:{name:'Armamento e proteção',cols:[['Arma de porte prevista','Arma de porte'],['Arma de Alta Energia prevista','Alta energia'],['Espingarda prevista','Espingarda'],['AINM prevista','AINM'],['Escudo Balístico previsto','Escudo bal.'],['Capacete Balístico previsto','Capacete bal.'],['Coletes previsto','Coletes'],['Etilômetro previsto','Etilômetro'],['Capacete para motocilista previsto','Cap. moto']]},
  via:{name:'Viaturas',cols:[['VP Tipo 1 POG prevista','VP Tipo 1 POG'],['VP Tipo 2 prevista','VP Tipo 2'],['BSC prevista','BSC'],['BCM prevista','BCM'],['Motocicleta prevista','Motocicleta'],['VP PROERD prevista','PROERD'],['VP Escolar prevista','Escolar'],['VP PVD prevista','PVD'],['VP SIPOM prevista','SIPOM'],['VP Coord Estrat prevista','Coord. Estrat.'],['VP Coord Controle prevista','Coord. Controle'],['TPO previsto','TPO'],['TC/Adm prevista','TC/Adm'],['Ambulância prevista','Ambulância'],['VP CTPM prevista','VP CTPM'],['TPO CTPM previsto','TPO CTPM'],['REDEC prevista','REDEC']]},
  tic:{name:'Comunicação e informática',cols:[['Rádio Móvel previsto','Rádio móvel'],['HT previsto','HT'],['Computador previsto','Computador'],['Notebook previsto','Notebook']]}
};
const QDL_ALL_COLS=[].concat(...Object.values(QDL_GROUPS).map(g=>g.cols));
function qdlBat(p){
  p=String(p||'').trim();
  if(/^4 RPM$/.test(p)) return 'EM 4ª RPM';
  if(/RMOP/.test(p)) return 'Reserva (RMOP)';
  const r=p.match(/^(\d+) BPM/); if(r) return r[1]+'º BPM';
  const c=p.match(/^(\d+) CIA PM IND/); if(c) return c[1]+'ª Cia PM Ind';
  return p;
}
function parseQDL(sheets,file){
  const sh=sheets.find(x=>x.name.trim().toUpperCase()==='UDI')||sheets[0];
  const name=sh.name, rows=sh.rows;
  const hi=findHeader(rows,['Arma de porte prevista']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const unid=str(r[c['UNIDADE']]); if(!unid) continue;
    const o={unid, principal:str(r[c['PRINCIPAL']]), bat:qdlBat(r[c['PRINCIPAL']]), siad:str(r[c['SIAD']]), mun:str(r[c['MUNICÍPIO']]), efetivo:num(r[c['EFETIVO']])};
    QDL_ALL_COLS.forEach(([k])=>{ o[k]=num(r[c[k]]); });
    o.viaturas=QDL_GROUPS.via.cols.reduce((a,[k])=>a+o[k],0);
    o.radios=o['Rádio Móvel previsto']+o['HT previsto'];
    out.push(o);
  }
  return {rows:out,file,sheet:name};
}

/* ---- Drones ---- */
function toDate(v){
  if(Object.prototype.toString.call(v)==='[object Date]') return isNaN(v)?null:v;
  if(typeof v==='number'&&v>20000&&v<80000&&typeof XLSX!=='undefined'){const d=XLSX.SSF.parse_date_code(v);return new Date(d.y,d.m-1,d.d);}
  if(typeof v==='string'){
    const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
    const i=v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(i) return new Date(+i[1],+i[2]-1,+i[3]);
  }
  return null;
}
function parseDrones(rows,file){
  const hi=findHeader(rows,['PREFIXO','VALIDADE SISANT']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const g=(r,k)=>r[c[k]];
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const unid=str(g(r,'UNIDADE')), prefixo=str(g(r,'PREFIXO')), pat=str(g(r,'Nº DE PATRIMÔNIO'));
    if(!unid&&!prefixo&&!pat) continue;
    out.push({
      unid, prefixo, pat, sei:str(g(r,'PROCESSO SEI')), codUnid:str(g(r,'CODIGO UNIDADE')),
      modelo:str(g(r,'MARCA / MODELO')), serie:str(g(r,'Nº DE SÉRIE')),
      status:str(g(r,'STATUS')), sit:str(g(r,'SITUAÇÃO')),
      ultimoVoo:toDate(g(r,'ÚLTIMO VOO')), voos:num(g(r,'TOTAL DE VOOS')),
      sisant:toDate(g(r,'VALIDADE SISANT')), sisantRaw:str(g(r,'VALIDADE SISANT')),
      aquis:toDate(g(r,'DATA DA AQUISIÇÃO')), aquisRaw:str(g(r,'DATA DA AQUISIÇÃO')),
      batOk:num(g(r,'QUANTIDADE DE BATERIAS EM CONDIÇÕES DE USO')), batBx:num(g(r,'QUANTIDADE DE BATERIAS BAIXADAS')),
      cidade:str(g(r,'CIDADE')), endereco:str(g(r,'ENDEREÇO')),
      pg:str(g(r,'P/G')), nome:str(g(r,'NOME')), npm:str(g(r,'Nº PM')), cia:str(g(r,'CIA')),
      contato:str(g(r,'CONTATO')), email:str(g(r,'EMAIL')), obs:str(g(r,'OBS')),
      assin:str(g(r,'Assinaturas'))
    });
  }
  return {rows:out,file};
}
function sisantState(d){
  if(!d.sisant) return {cls:'other',txt:d.sisantRaw||'sem registro'};
  const today=new Date(); today.setHours(0,0,0,0);
  const days=Math.round((d.sisant-today)/864e5);
  const dt=d.sisant.toLocaleDateString('pt-BR');
  if(days<0) return {cls:'pend',txt:`${dt} · vencido há ${n(-days)} d`};
  if(days<=60) return {cls:'trans',txt:`${dt} · vence em ${n(days)} d`};
  return {cls:'uso',txt:dt};
}

function ingest(name,sheets){
  const rows=sheets[0].rows;
  const m=parseMapa(rows,name);
  if(m){ S.mapa=m; return `${name}: mapa carga, ${n(m.rows.length)} itens`; }
  const g=parseGuias(rows,name);
  if(g){ S.guias=g; return `${name}: guias, ${n(g.rows.length)} itens`; }
  const q=parseQDL(sheets,name);
  if(q){ S.qdl=q; return `${name}: QDL, ${n(q.rows.length)} linhas`; }
  const d=parseDrones(rows,name);
  if(d){ S.drones=d; return `${name}: drones, ${n(d.rows.length)} aeronaves`; }
  return null;
}
function afterLoad(){
  S.drill=null; S.page=1;
  if(!S[S.tab]) S.tab=['mapa','guias','qdl','drones'].find(k=>S[k])||'mapa';
  render();
}
async function loadFiles(list){
  if(typeof XLSX==='undefined'){ alert('Sem acesso à internet a leitura de planilhas avulsas não funciona; os dados embutidos continuam disponíveis.'); return; }
  S.loaded=[]; S.fonte='arquivo';
  for(const f of list){
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      const msg=ingest(f.name,wbSheets(wb));
      S.loaded.push(msg?{ok:true,msg}:{ok:false,msg:`${f.name}: não reconhecido (esperado Mapa Carga, Guias não confirmadas, QDL ou Planilha de Drones)`});
    }catch(e){ S.loaded.push({ok:false,msg:`${f.name}: erro ao ler (${e.message})`}); }
  }
  afterLoad();
}
/* dados embutidos pelo gerar_painel.py */
function loadEmbedded(){
  const el=document.getElementById('dados-embutidos');
  if(!el) return false;
  try{
    const pack=JSON.parse(el.textContent);
    S.loaded=[]; S.fonte='embutido'; S.geradoEm=pack.geradoEm||null;
    for(const arq of pack.arquivos){
      const msg=ingest(arq.nome,arq.planilhas);
      S.loaded.push(msg?{ok:true,msg}:{ok:false,msg:`${arq.nome}: não reconhecido`});
    }
    return true;
  }catch(e){ console.error(e); return false; }
}
/* dados cifrados (gerar_painel.py --senha) */
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function decifrar(pack,senha){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(senha),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(pack.salt),iterations:pack.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(pack.iv)},key,b64(pack.dados));
  let bytes=new Uint8Array(plain);
  if(pack.gzip){
    const ds=new DecompressionStream('gzip');
    const resp=new Response(new Blob([bytes]).stream().pipeThrough(ds));
    bytes=new Uint8Array(await resp.arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function lockScreen(){
  const el=document.getElementById('dados-cifrados');
  if(!el) return false;
  $('tabs').hidden=true; $('btnLoad').hidden=true; $('btnPrint').hidden=true;
  $('main').innerHTML=`<div class="lock">
    <h2>Painel protegido</h2>
    <p>Os dados deste painel estão cifrados. Informe a senha para abrir.</p>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" autofocus>
    <button class="btn primary" id="btnSenha">Entrar</button>
    <div class="err" id="senhaErr"></div>
  </div>`;
  const tentar=async()=>{
    const senha=$('senha').value; if(!senha) return;
    $('btnSenha').disabled=true; $('senhaErr').textContent='Decifrando…';
    try{
      const pack=await decifrar(JSON.parse(el.textContent),senha);
      S.loaded=[]; S.fonte='embutido'; S.geradoEm=pack.geradoEm||null;
      for(const arq of pack.arquivos){ const msg=ingest(arq.nome,arq.planilhas); S.loaded.push(msg?{ok:true,msg}:{ok:false,msg:`${arq.nome}: não reconhecido`}); }
      $('btnLoad').hidden=false; afterLoad();
    }catch(e){
      $('senhaErr').textContent = (e.name==='OperationError'||/decrypt/i.test(String(e))) ? 'Senha incorreta.' : 'Não foi possível abrir: '+e.message;
      $('btnSenha').disabled=false; $('senha').select();
    }
  };
  $('btnSenha').addEventListener('click',tentar);
  $('senha').addEventListener('keydown',e=>{ if(e.key==='Enter') tentar(); });
  return true;
}
/* arquivos na pasta dados/ (só funciona servido por http) */
async function loadFromServer(){
  if(location.protocol==='file:') return false;
  let any=false; const msgs=[];
  for(const url of ARQUIVOS){
    try{
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok) continue;
      const wb=XLSX.read(await res.arrayBuffer(),{type:'array',cellDates:true});
      const msg=ingest(url,wbSheets(wb));
      msgs.push(msg?{ok:true,msg}:{ok:false,msg:`${url}: não reconhecido`});
      if(msg) any=true;
    }catch(e){ /* arquivo ausente: ignora */ }
  }
  if(any){ S.loaded=msgs; S.fonte='servidor'; }
  return any;
}
async function autoLoad(){
  if(lockScreen()) return;
  const ok = await loadFromServer() || loadEmbedded();
  if(ok) afterLoad();
}

function mapaFiltered(){
  const f=S.f, q=f.q.toLowerCase();
  return S.mapa.rows.filter(r=>
    (!f.bat || r.bat===f.bat) &&
    (!f.unid|| r.unid===f.unid) &&
    (!f.dest|| destClass(r.dest)===f.dest) &&
    (!f.mun || r.mun===f.mun) &&
    (!q || r.mat.toLowerCase().includes(q) || r.pat.includes(q) || r.serie.toLowerCase().includes(q) || r.placa.toLowerCase().includes(q) || r.modelo.toLowerCase().includes(q) || r.marca.toLowerCase().includes(q))
  );
}
function guiasFiltered(){
  const g=S.g, q=g.q.toLowerCase();
  return S.guias.rows.filter(r=>
    (!g.bat || r.bat===g.bat) &&
    (!q || r.mat.toLowerCase().includes(q) || r.pat.includes(q) || r.destino.toLowerCase().includes(q) || r.origem.toLowerCase().includes(q) || r.doc.toLowerCase().includes(q))
  );
}
function groupBy(rows,key){
  const m=new Map();
  for(const r of rows){
    const k=r[key];
    let g=m.get(k);
    if(!g){ g={key:k,count:0,valor:0,uso:0,estoq:0,pend:0,trans:0,other:0}; m.set(k,g); }
    g.count++; g.valor+=r.valor; g[destClass(r.dest)]++;
  }
  return [...m.values()];
}
function sortRows(rows,[k,dir]){
  const s=dir==='asc'?1:-1;
  return rows.slice().sort((a,b)=>{
    const x=a[k],y=b[k];
    if(typeof x==='number'&&typeof y==='number') return (x-y)*s;
    return String(x??'').localeCompare(String(y??''),'pt-BR',{numeric:true})*s;
  });
}
const uniq=(rows,k)=>[...new Set(rows.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
const BAT_ORDER=['EM 4ª RPM','Órgãos 4ª RPM','2º BPM','21º BPM','27º BPM','47º BPM','68º BPM','4ª Cia PM Ind','10ª Cia PM Ind','Saúde (CAS)','Outros'];
const batSort=(a,b)=>{const i=BAT_ORDER.indexOf(a),j=BAT_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b);};

  let html=`
  <div class="filters">
    <label>Batalhão / setor<select id="fBat"><option value="">Todos</option>${uniq(all,'bat').sort(batSort).map(b=>`<option ${f.bat===b?'selected':''}>${esc(b)}</option>`).join('')}</select></label>

  <div class="summary">

  if(!S.drill){

    <div class="tbl-wrap"><table>
      <thead><tr>${th('pat','Patrimônio','guias')}${th('mat','Material','guias')}${th('origem','Origem (proprietário)','guias')}${th('destino','Destino','guias')}${th('doc','Documento','guias')}${th('valor','Valor','guias','num')}</tr></thead>
      <tbody>${sorted.map(r=>`<tr><td class="mono">${esc(r.pat)}</td><td>${esc(r.mat)}</td><td>${esc(r.origem)}</td><td>${esc(r.destino)}</td><td class="mono">${esc(r.doc)}</td><td class="num">${brl(r.valor)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">Nenhuma guia com os filtros atuais.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

/* ---------- QDL ---------- */
const CROSS=[
  ['Arma de porte',['Arma de porte prevista'],/^(PISTOLA|REVOLVER)\b/],
  ['Arma de alta energia',['Arma de Alta Energia prevista'],/^(FUZIL|CARABINA)\b/],
  ['Espingarda',['Espingarda prevista'],/^ESPINGARDA/],
  ['AINM',['AINM prevista'],/^ARMA DE IMOBILIZACAO/],
  ['Escudo balístico',['Escudo Balístico previsto'],/^ESCUDO DE PROTECAO BALISTICA/],
  ['Capacete balístico',['Capacete Balístico previsto'],/^CAPACETE DE PROTECAO BALISTICA/],
  ['Etilômetro',['Etilômetro previsto'],/^ETILOMETRO/],
  ['Rádios (móvel + HT)',['Rádio Móvel previsto','HT previsto'],/^RADIO (TRANSCEPTOR|COMUNICADOR)/],
  ['Computador',['Computador previsto'],/^COMPUTADOR\b/],
  ['Notebook',['Notebook previsto'],/^NOTEBOOK/],
  ['Motocicleta',['Motocicleta prevista'],/^(MOTOCICLETA|VIATURA MOTOCICLETA)/],
  ['Viaturas (exceto moto)',QDL_GROUPS.via.cols.map(c=>c[0]).filter(k=>k!=='Motocicleta prevista'),/^(VIATURA (?!MOTOCICLETA)|AUTOMOVEL|VEICULO DE SERVICO|CAMINHONETE)/]
];
function qdlFiltered(){ const q=S.q; return S.qdl.rows.filter(r=>(!q.bat||r.bat===q.bat)&&(!q.mun||r.mun.toLowerCase().includes(q.mun.toLowerCase()))); }
function renderQDL(){
  const all=S.qdl.rows, rows=qdlFiltered(), q=S.q;
  const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  const grp=QDL_GROUPS[q.grp];
  const bats=[...new Set(all.map(r=>r.bat))].sort(batSort);
  const byBat=bats.map(b=>{const rr=all.filter(r=>r.bat===b);const o={bat:b,n:rr.length};['efetivo','Arma de porte prevista','Arma de Alta Energia prevista','viaturas','Motocicleta prevista','Rádio Móvel previsto','HT previsto','Computador previsto'].forEach(k=>o[k]=rr.reduce((a,r)=>a+r[k],0));return o;});
  const sorted=sortRows(rows,S.sort.qdl);

  let cross='';
  if(S.mapa){
    const mapaRows=S.mapa.rows.filter(r=>!q.bat || r.bat===q.bat || (q.bat==='EM 4ª RPM'&&r.bat==='Órgãos 4ª RPM'));
    const lines=CROSS.map(([nome,keys,re])=>{
      const prev=rows.reduce((a,r)=>a+keys.reduce((b,k)=>b+r[k],0),0);
      const exist=mapaRows.filter(r=>re.test(r.mat)).length;
      return {nome,prev,exist,dif:exist-prev};
    });
    cross=`<div class="panel">
      <div class="panel-h"><h2>Previsto no QDL × existente no mapa carga</h2><span class="hint">${q.bat? esc(q.bat):'toda a 4ª RPM'} · contagem por descrição do material, aproximada</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Material</th><th class="num">Previsto (QDL)</th><th class="num">Existente (mapa carga)</th><th class="num">Diferença</th><th>Cobertura</th></tr></thead>
        <tbody>${lines.map(l=>`<tr><td>${l.nome}</td><td class="num">${n(l.prev)}</td><td class="num">${n(l.exist)}</td><td class="num" style="${l.dif<0?'color:var(--red);font-weight:600':l.dif>0?'color:var(--green)':''}">${l.dif>0?'+':''}${n(l.dif)}</td>
          <td><div class="bar" style="max-width:220px"><i style="width:${l.prev?Math.min(100,l.exist/l.prev*100):0}%;background:${l.dif<0?'var(--red)':'var(--ink)'}"></i></div></td></tr>`).join('')}</tbody>
      </table></div>
      <div class="legend"><span>O mapa carga não separa rádio móvel de HT nem identifica coletes; viaturas locadas (terceiros) contam como existentes. Use como indicativo, não como conferência oficial.</span></div>
    </div>`;
  }

  return `
  <div class="filters">
    <label>Batalhão / unidade principal<select id="qBat"><option value="">Todos</option>${bats.map(b=>`<option ${q.bat===b?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
    <label>Grupo de material<select id="qGrp">${Object.entries(QDL_GROUPS).map(([k,g])=>`<option value="${k}" ${q.grp===k?'selected':''}>${g.name}</option>`).join('')}</select></label>
    <label>Município<input type="search" id="qMun" value="${esc(q.mun)}" placeholder="filtrar município"></label>
    <button class="clear" id="qClear">Limpar filtros</button>
  </div>

  <div class="summary">
    <div><div class="k">Efetivo previsto</div><div class="v">${n(sum('efetivo'))}</div><div class="s">${n(rows.length)} linhas · ${n(new Set(rows.map(r=>r.mun)).size)} municípios</div></div>
    <div><div class="k">Armas de porte</div><div class="v">${n(sum('Arma de porte prevista'))}</div><div class="s">alta energia: ${n(sum('Arma de Alta Energia prevista'))}</div></div>
    <div><div class="k">Coletes</div><div class="v">${n(sum('Coletes previsto'))}</div></div>
    <div><div class="k">Viaturas</div><div class="v">${n(sum('viaturas'))}</div><div class="s">das quais motos: ${n(sum('Motocicleta prevista'))}</div></div>
    <div><div class="k">Rádios</div><div class="v">${n(sum('radios'))}</div><div class="s">móvel ${n(sum('Rádio Móvel previsto'))} · HT ${n(sum('HT previsto'))}</div></div>
    <div><div class="k">Computadores</div><div class="v">${n(sum('Computador previsto'))}</div><div class="s">notebooks: ${n(sum('Notebook previsto'))}</div></div>
  </div>

  ${q.bat?'':`<div class="panel">
    <div class="panel-h"><h2>Dotação prevista por batalhão</h2><span class="hint">clique para filtrar</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Batalhão</th><th class="num">Municípios</th><th class="num">Efetivo</th><th class="num">Arma de porte</th><th class="num">Alta energia</th><th class="num">Viaturas</th><th class="num">Motos</th><th class="num">Rádio móvel</th><th class="num">HT</th><th class="num">Computador</th></tr></thead>
      <tbody>${byBat.map(b=>`<tr class="click" data-qbat="${esc(b.bat)}"><td>${esc(b.bat)}</td><td class="num">${n(b.n)}</td><td class="num">${n(b.efetivo)}</td><td class="num">${n(b['Arma de porte prevista'])}</td><td class="num">${n(b['Arma de Alta Energia prevista'])}</td><td class="num">${n(b.viaturas)}</td><td class="num">${n(b['Motocicleta prevista'])}</td><td class="num">${n(b['Rádio Móvel previsto'])}</td><td class="num">${n(b['HT previsto'])}</td><td class="num">${n(b['Computador previsto'])}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`}

  ${cross}

  <div class="panel">
    <div class="panel-h"><h2>${grp.name} — previsão por município</h2><span class="right">${n(rows.length)} linhas &nbsp; <a style="cursor:pointer;text-decoration:underline" id="csv">Exportar CSV</a></span></div>
    <div class="tbl-wrap"><table>
      <thead><tr>${th('unid','Unidade','qdl')}${th('mun','Município','qdl')}${th('efetivo','Efetivo','qdl','num')}${grp.cols.map(([k,l])=>th(k,l,'qdl','num')).join('')}</tr></thead>
      <tbody>${sorted.map(r=>`<tr><td>${esc(r.unid)}</td><td>${esc(r.mun)}</td><td class="num">${n(r.efetivo)}</td>${grp.cols.map(([k])=>`<td class="num" style="${r[k]?'':'color:var(--ink-3)'}">${n(r[k])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${3+grp.cols.length}" class="empty">Nenhuma linha com os filtros atuais.</td></tr>`}</tbody>
      <tfoot><tr><th>Total</th><th></th><th class="num">${n(sum('efetivo'))}</th>${grp.cols.map(([k])=>`<th class="num">${n(sum(k))}</th>`).join('')}</tr></tfoot>
    </table></div>
  </div>`;
}

/* ---------- Drones ---------- */
function dronesFiltered(){ const d=S.d,q=d.q.toLowerCase(); return S.drones.rows.filter(r=>(!d.unid||r.unid===d.unid)&&(!q||[r.prefixo,r.modelo,r.pat,r.serie,r.nome,r.cidade,r.sei].some(v=>v.toLowerCase().includes(q)))); }
function renderDrones(){
  const all=S.drones.rows, rows=dronesFiltered(), d=S.d;
  const today=new Date(); today.setHours(0,0,0,0);
  const emUso=rows.filter(r=>r.sit==='EM USO').length;
  const baixados=rows.filter(r=>/BAIX/.test(r.sit)||/BAIX/.test(r.status)).length;
  const vencidos=rows.filter(r=>r.sisant&&r.sisant<today&&!/BAIX/.test(r.sit)).length;
  const vencendo=rows.filter(r=>r.sisant&&r.sisant>=today&&(r.sisant-today)/864e5<=60).length;
  const incompletos=rows.filter(r=>!r.pat||!r.modelo||!r.sisant).length;
  const batOk=rows.reduce((a,r)=>a+r.batOk,0), batBx=rows.reduce((a,r)=>a+r.batBx,0);
  const sorted=sortRows(rows,S.sort.drones);
  const fd=v=>v?v.toLocaleDateString('pt-BR'):'';
  return `
  <div class="filters">
    <label>Unidade<select id="dUnid"><option value="">Todas</option>${uniq(all,'unid').map(u=>`<option ${d.unid===u?'selected':''}>${esc(u)}</option>`).join('')}</select></label>
    <label>Buscar<input type="search" id="dQ" value="${esc(d.q)}" placeholder="prefixo, modelo, patrimônio, série, responsável"></label>
    <button class="clear" id="dClear">Limpar filtros</button>
  </div>

  <div class="summary">
    <div><div class="k">Aeronaves</div><div class="v">${n(rows.length)}</div><div class="s">em uso ${n(emUso)} · baixadas ${n(baixados)}</div></div>
    <div><div class="k">SISANT vencido</div><div class="v ${vencidos?'red':''}">${n(vencidos)}</div><div class="s">${vencendo?`${n(vencendo)} vencem nos próximos 60 dias`:'cadastro na ANAC a renovar'}</div></div>
    <div><div class="k">Cadastro incompleto</div><div class="v ${incompletos?'amber':''}">${n(incompletos)}</div><div class="s">sem patrimônio, modelo ou validade</div></div>
    <div><div class="k">Baterias em condições</div><div class="v">${n(batOk)}</div><div class="s">baixadas: ${n(batBx)}</div></div>
    <div><div class="k">Voos registrados</div><div class="v">${n(rows.reduce((a,r)=>a+r.voos,0))}</div></div>
  </div>

  <div class="panel">
    <div class="panel-h"><h2>Frota de aeronaves remotamente pilotadas</h2><span class="hint">hoje: ${today.toLocaleDateString('pt-BR')}</span><span class="right"><a style="cursor:pointer;text-decoration:underline" id="csv">Exportar CSV</a></span></div>
    <div class="tbl-wrap"><table>
      <thead><tr>${th('unid','Unidade','drones')}${th('prefixo','Prefixo','drones')}${th('modelo','Modelo','drones')}${th('pat','Patrimônio','drones')}${th('sit','Situação','drones')}${th('sisant','Validade SISANT','drones')}${th('ultimoVoo','Último voo','drones')}${th('voos','Voos','drones','num')}${th('batOk','Baterias','drones','num')}${th('nome','Responsável','drones')}<th>SEI</th><th>Obs.</th></tr></thead>
      <tbody>${sorted.map(r=>{const st=sisantState(r);return `<tr>
        <td>${esc(r.unid)}<br><small style="color:var(--ink-3)">${esc(r.cidade)}</small></td>
        <td class="mono">${esc(r.prefixo)}</td>
        <td>${esc(r.modelo)}<br><small class="mono" style="color:var(--ink-3)">${esc(r.serie)}</small></td>
        <td class="mono">${esc(r.pat)}</td>
        <td>${r.sit?`<span class="tag ${/BAIX/.test(r.sit)?'other':'uso'}">${esc(r.sit)}</span>`:'<span class="tag trans">sem cadastro</span>'}</td>
        <td><span class="tag ${/BAIX/.test(r.sit)?'other':st.cls}">${esc(st.txt)}</span></td>
        <td>${fd(r.ultimoVoo)}</td>
        <td class="num">${r.voos?n(r.voos):''}</td>
        <td class="num">${r.batOk||r.batBx?`${n(r.batOk)} <small style="color:var(--ink-3)">/ ${n(r.batBx)} bx</small>`:''}</td>
        <td>${esc([r.pg,r.nome].filter(Boolean).join(' '))}<br><small style="color:var(--ink-3)">${esc(r.contato)}</small></td>
        <td class="mono">${esc(r.sei)}</td>
        <td><small>${esc(r.obs)}</small></td></tr>`;}).join('')||`<tr><td colspan="12" class="empty">Nenhuma aeronave com os filtros atuais.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

/* ---------- utilitários de render ---------- */
function pct(a,b){ return b? (a/b*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—'; }
function th(key,label,sortKey,cls=''){
  const [k,d]=S.sort[sortKey];
  return `<th class="${cls} ${k===key?'sort-'+d:''}" data-sort="${sortKey}" data-key="${key}">${label}</th>`;
}
function pager(pages){
  if(pages<=1) return '';
  return `<div class="pager"><span>Página ${S.page} de ${pages}</span><span class="spacer"></span>
    <button data-pg="-1" ${S.page<=1?'disabled':''}>Anterior</button><button data-pg="1" ${S.page>=pages?'disabled':''}>Próxima</button></div>`;
}
function exportCSV(rows,cols,name){
  const head=cols.map(c=>c[1]).join(';');
  const body=rows.map(r=>cols.map(c=>{const v=r[c[0]];return typeof v==='number'?String(v).replace('.',','):'"'+String(v??'').replace(/"/g,'""')+'"';}).join(';')).join('\n');
  const blob=new Blob(['\ufeff'+head+'\n'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}

/* ============================================================
   Eventos
   ============================================================ */
function bindDrop(){
  const d=$('drop'); if(!d) return;
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',e=>loadFiles([...e.dataTransfer.files]));
}
function bindCommon(){
  bindDrop();
  const on=(id,ev,fn)=>{const el=$(id); if(el) el.addEventListener(ev,fn);};
  const setF=(k,v)=>{S.f[k]=v; if(k==='bat') S.f.unid=''; S.page=1; S.drill=null; render();};
  on('fBat','change',e=>setF('bat',e.target.value));
  on('fUnid','change',e=>setF('unid',e.target.value));
  on('fDest','change',e=>setF('dest',e.target.value));
  on('fMun','change',e=>setF('mun',e.target.value));
  on('fQ','input',debounce(e=>{S.f.q=e.target.value;S.page=1;render();refocus('fQ');},250));
  on('fClear','click',()=>{S.f={bat:'',unid:'',dest:'',mun:'',q:''};S.drill=null;S.page=1;render();});
  on('gBat','change',e=>{S.g.bat=e.target.value;render();});
  on('gQ','input',debounce(e=>{S.g.q=e.target.value;render();refocus('gQ');},250));
  on('gClear','click',()=>{S.g={bat:'',dest:'',q:''};render();});
  on('back','click',()=>{S.drill=null;S.page=1;render();});
  on('qBat','change',e=>{S.q.bat=e.target.value;render();});
  on('qGrp','change',e=>{S.q.grp=e.target.value;render();});
  on('qMun','input',debounce(e=>{S.q.mun=e.target.value;render();refocus('qMun');},250));
  on('qClear','click',()=>{S.q={bat:'',grp:'arm',mun:''};render();});
  on('dUnid','change',e=>{S.d.unid=e.target.value;render();});
  on('dQ','input',debounce(e=>{S.d.q=e.target.value;render();refocus('dQ');},250));
  on('dClear','click',()=>{S.d={unid:'',q:''};render();});
  document.querySelectorAll('tr[data-qbat]').forEach(el=>el.addEventListener('click',()=>{S.q.bat=el.dataset.qbat;render();}));

  document.querySelectorAll('.bar-row[data-bat]').forEach(el=>{
    const go=()=>{S.f.bat=S.f.bat===el.dataset.bat?'':el.dataset.bat;S.f.unid='';S.page=1;render();};
    el.addEventListener('click',go); el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
  document.querySelectorAll('.bar-row[data-dest]').forEach(el=>{
    const go=()=>{S.g.q=S.g.q===el.dataset.dest?'':el.dataset.dest;render();};
    el.addEventListener('click',go); el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
  document.querySelectorAll('tr[data-unid]').forEach(el=>el.addEventListener('click',()=>{S.drill=el.dataset.unid;S.page=1;render();window.scrollTo({top:0});}));
  document.querySelectorAll('th[data-sort]').forEach(el=>el.addEventListener('click',()=>{
    const s=S.sort[el.dataset.sort]; const k=el.dataset.key;
    S.sort[el.dataset.sort]= s[0]===k? [k,s[1]==='asc'?'desc':'asc'] : [k, ['valor','count','pend','trans','uso','estoq'].includes(k)?'desc':'asc'];
    S.page=1; render();
  }));
  document.querySelectorAll('[data-pg]').forEach(el=>el.addEventListener('click',()=>{S.page+=+el.dataset.pg;render();}));
  on('csv','click',()=>{
    if(S.tab==='mapa'){
      const rows=S.drill? mapaFiltered().filter(r=>r.unid===S.drill):mapaFiltered();
      exportCSV(rows,[['pat','Patrimônio'],['unid','Unidade responsável'],['bat','Batalhão'],['mun','Município'],['mat','Material'],['marca','Marca'],['modelo','Modelo'],['serie','Série'],['placa','Placa'],['dest','Situação'],['tipo','Tipo'],['elem','Elemento'],['valor','Valor']],'mapa-carga-filtrado.csv');
    }else if(S.tab==='qdl'){
      exportCSV(qdlFiltered(),[['unid','Unidade'],['bat','Batalhão'],['mun','Município'],['efetivo','Efetivo'],...QDL_ALL_COLS.map(([k,l])=>[k,l])],'qdl-filtrado.csv');
    }else if(S.tab==='drones'){
      exportCSV(dronesFiltered().map(r=>({...r,sisant:r.sisant?r.sisant.toLocaleDateString('pt-BR'):r.sisantRaw,ultimoVoo:r.ultimoVoo?r.ultimoVoo.toLocaleDateString('pt-BR'):'',aquis:r.aquis?r.aquis.toLocaleDateString('pt-BR'):r.aquisRaw})),[['unid','Unidade'],['prefixo','Prefixo'],['modelo','Modelo'],['pat','Patrimônio'],['serie','Série'],['status','Status'],['sit','Situação'],['sisant','Validade SISANT'],['ultimoVoo','Último voo'],['voos','Voos'],['batOk','Baterias OK'],['batBx','Baterias baixadas'],['aquis','Aquisição'],['cidade','Cidade'],['pg','P/G'],['nome','Responsável'],['contato','Contato'],['sei','Processo SEI'],['obs','Obs']],'drones.csv');
    }else{
      exportCSV(guiasFiltered(),[['pat','Patrimônio'],['mat','Material'],['origem','Origem'],['gerencial','Unidade gerencial'],['destino','Destino'],['codDestino','Cód. destino'],['doc','Documento'],['valor','Valor']],'guias-nao-confirmadas.csv');
    }
  });
}
function refocus(id){ const el=$(id); if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; } }
function debounce(fn,ms){ let t; return e=>{clearTimeout(t); t=setTimeout(()=>fn(e),ms);}; }

$('btnLoad').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{ loadFiles([...e.target.files]); e.target.value=''; });
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.page=1;render();}));
/* arrastar em qualquer lugar da página */
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{ if(!e.target.closest('#drop')){ e.preventDefault(); if(e.dataTransfer.files.length) loadFiles([...e.dataTransfer.files]); } });

render();
