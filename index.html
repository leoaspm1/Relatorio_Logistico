<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório da 4ª RPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#e8e4dc;        /* texto principal (claro sobre fundo escuro) */
    --ink-2:#b0a99a;
    --ink-3:#8a8370;
    --line:#2e2a22;
    --paper:#12100c;
    --white:#1a1710;
    --red:#e05555;        /* vermelho para pendência */
    --amber:#d4a840;
    --green:#4aad7a;
    --steel:#9a8e6e;
    --khaki:#b5a682;
    --khaki-lt:#c8bb9a;
    --khaki-dk:#9a8e6e;
    --navy:#2a2418;
    --navy-deep:#1a1710;
    --font-head:"Bahnschrift","Segoe UI Semibold","Roboto Condensed","Arial Narrow",sans-serif;
    --font-body:"Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;
    --glow-khaki:rgba(181,166,130,.12);
    --card-bg:#1e1b14;
    --card-border:#2e2a22;
    --radius:8px;
    --radius-lg:12px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.25);
    --shadow-md:0 4px 12px rgba(0,0,0,.35);
    --shadow-lg:0 8px 24px rgba(0,0,0,.45);
    --font-mono:'IBM Plex Mono','Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  /* grid background pattern */
  body>*{position:relative;z-index:1}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer;transition:all .2s ease}
  :focus-visible{outline:2px solid var(--khaki);outline-offset:2px}
  ::selection{background:rgba(181,166,130,.35);color:#fff}

  /* ---------- cabeçalho novo (identidade PMMG) ---------- */
  .header-khaki{background:linear-gradient(180deg,#c8bb9a 0%,var(--khaki) 100%);display:flex;justify-content:center;align-items:flex-end;padding:28px 16px 32px;position:relative}
  .brasao-svg{width:auto;height:110px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.5));border-radius:6px;object-fit:contain;transition:transform .3s ease}
  .brasao-svg:hover{transform:scale(1.03)}
  header{background:linear-gradient(180deg,rgba(200,187,154,.92) 0%,rgba(168,154,118,.95) 100%);color:#2a2418;padding:18px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-bottom:3px solid rgba(26,23,16,.2);box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  header h1{font:700 26px/1.1 var(--font-head);margin:0;letter-spacing:.03em;color:#1a1710;text-shadow:0 1px 0 rgba(200,187,154,.3)}
  header h1 small{display:block;font:600 13px/1.3 var(--font-body);color:#3a3220;margin-top:5px;letter-spacing:.01em}
  header .spacer{flex:1}
  .ref{font-size:13px;color:#5a5040}
  .ref b{color:#1a1710;font-weight:600}
  .btn{border:1px solid #8a7e68;background:transparent;color:#3a3228;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;letter-spacing:.01em;transition:all .2s ease}
  .btn:hover{background:rgba(26,23,16,.1);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:#1a1710;color:var(--khaki-lt);border-color:#1a1710;font-weight:700;box-shadow:var(--shadow-sm)}
  .btn.primary:hover{background:#2a2418;box-shadow:var(--shadow-md)}

  nav.tabs{background:linear-gradient(180deg,#1e1b14 0%,#161310 100%);border-bottom:2px solid var(--khaki-dk);padding:0 28px;display:flex;gap:2px;box-shadow:inset 0 -1px 0 rgba(181,166,130,.1)}
  nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 20px;font:600 13px/1 var(--font-head);color:#7a7058;transition:all .25s ease;letter-spacing:.05em;text-transform:uppercase;position:relative}
  nav.tabs button:hover{color:var(--khaki-lt);background:rgba(181,166,130,.06)}
  nav.tabs button[aria-selected="true"]{color:#1a1710;border-bottom-color:transparent;background:linear-gradient(180deg,var(--khaki) 0%,#c2b48e 100%);border-radius:6px 6px 0 0;box-shadow:0 -2px 8px rgba(181,166,130,.2)}
  nav.tabs button .n{display:inline-block;margin-left:8px;font:600 11px/1 var(--font-body);background:#2a2418;border:1px solid #3a3228;border-radius:12px;padding:3px 8px;color:var(--khaki);transition:all .2s}
  nav.tabs button[aria-selected="true"] .n{background:rgba(26,23,16,.2);border-color:rgba(26,23,16,.15);color:#2a2418;font-weight:700}
  nav.tabs button .n.alert{background:#4a1a1a;border-color:#6a2a2a;color:#f77;animation:pulse-alert 2s infinite}

  main{padding:28px 28px 60px;max-width:1360px;margin:0 auto}
  @keyframes pulse-alert{0%,100%{opacity:1}50%{opacity:.6}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  main>*{animation:fadeIn .3s ease}

  /* ---------- estado vazio ---------- */
  .drop{border:2px dashed var(--khaki-dk);background:var(--card-bg);border-radius:var(--radius-lg);padding:56px 36px;text-align:center;max-width:720px;margin:60px auto;box-shadow:var(--shadow-md);transition:all .3s ease}
  .drop.over{border-color:var(--khaki);background:rgba(163,151,117,.08);box-shadow:var(--shadow-lg),0 0 30px rgba(181,166,130,.1)}
  .drop h2{font:600 24px/1.2 var(--font-head);margin:0 0 10px}
  .drop p{margin:6px 0;color:var(--ink-2)}
  .drop code{background:#161310;padding:3px 8px;border-radius:4px;font-size:13px;border:1px solid var(--card-border)}
  .drop .btn{margin-top:20px}
  .drop .btn.primary{background:linear-gradient(180deg,var(--khaki-lt),var(--khaki));color:#1a1710;border-color:var(--khaki);box-shadow:var(--shadow-sm)}
  .drop .btn.primary:hover{background:linear-gradient(180deg,#d4c8a8,var(--khaki-lt));box-shadow:var(--shadow-md)}
  .files{margin-top:16px;font-size:13px;color:var(--ink-2)}
  .files span{display:inline-block;margin:3px 6px;padding:3px 8px;background:#221f18;border-radius:3px}
  .files span.ok{color:var(--green)}
  .files span.err{color:var(--red)}

  /* ---------- senha (dark mode / identidade PMMG) ---------- */
  .lock-wrap{display:flex;align-items:center;justify-content:center;padding:40px 16px 60px;min-height:50vh}
  .lock{background:linear-gradient(180deg,#201d16 0%,#1a1710 100%);border:1px solid #3a3428;border-radius:16px;padding:40px 36px 36px;max-width:420px;width:100%;text-align:center;color:#e8e4dc;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 0 1px rgba(181,166,130,.05)}
  .lock h2{font:600 22px/1.2 var(--font-head);margin:0 0 4px;color:#e8e4dc;letter-spacing:.02em}
  .lock p{color:#9a978f;margin:0 0 28px;font-size:13px}
  .lock .field{position:relative;margin-bottom:16px}
  .lock .field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9a978f;pointer-events:none;line-height:1}
  .lock .field-icon svg{width:18px;height:18px;fill:none;stroke:#9a978f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
  .lock input{width:100%;background:#161310;border:1px solid #3a3428;border-radius:8px;padding:13px 14px 13px 42px;font-size:14px;color:#c8c4bb;outline:none;transition:all .25s;box-shadow:inset 0 1px 4px rgba(0,0,0,.3)}
  .lock input::placeholder{color:#9a978f;opacity:.7}
  .lock input:focus{border-color:var(--khaki);box-shadow:0 0 0 3px rgba(163,151,117,.2),inset 0 1px 4px rgba(0,0,0,.3)}
  .lock .toggle-pw{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#9a978f;line-height:1;transition:color .2s}
  .lock .toggle-pw svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .lock .toggle-pw:hover{color:var(--khaki-lt)}
  .lock .actions{display:flex;align-items:center;gap:16px;margin-top:24px;flex-wrap:wrap}
  .lock .btn-entrar{background:linear-gradient(180deg,var(--khaki-lt) 0%,var(--khaki) 100%);color:#1a1710;border:none;border-radius:24px;padding:12px 36px;font:700 14px/1 var(--font-body);cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:0 2px 8px rgba(181,166,130,.3);letter-spacing:.02em}
  .lock .btn-entrar:hover{background:linear-gradient(180deg,#d4c8a8 0%,var(--khaki-lt) 100%);box-shadow:0 4px 16px rgba(181,166,130,.4);transform:translateY(-1px)}
  .lock .btn-entrar:active{transform:scale(.97);box-shadow:0 1px 4px rgba(181,166,130,.2)}
  .lock .btn-entrar:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
  .lock .link-forgot{font-size:13px;color:var(--khaki-lt);text-decoration:none;transition:color .2s}
  .lock .link-forgot:hover{color:var(--khaki);text-decoration:underline}
  .lock .err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
  .footer-bar{text-align:center;padding:12px 16px;font-size:11px;color:var(--ink-3);opacity:.6}
  @media(max-width:480px){
    .lock{padding:28px 20px 24px}
    .lock .actions{flex-direction:column;gap:12px}
    .lock .btn-entrar{width:100%;text-align:center}
  }

  /* ---------- filtros ---------- */
  .filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:24px;padding:16px 18px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .filters label{display:flex;flex-direction:column;gap:6px;font:600 11px/1.2 var(--font-head);color:var(--khaki-dk);text-transform:uppercase;letter-spacing:.05em}
  .filters select,.filters input{border:1px solid #3a3428;background:#161310;color:var(--ink);padding:9px 12px;border-radius:6px;min-width:160px;font-size:13px;font-family:var(--font-body);transition:all .2s ease;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
  .filters select:hover,.filters input:hover{border-color:#4a4232}
  .filters select:focus,.filters input:focus{border-color:var(--khaki);box-shadow:0 0 0 3px rgba(181,166,130,.15),inset 0 1px 3px rgba(0,0,0,.2);outline:none}
  .filters select option{background:#1a1710;color:var(--ink)}
  .filters input[type=search]{min-width:260px}
  .filters .clear{align-self:flex-end;border:0;background:none;color:var(--khaki-lt);text-decoration:none;padding:8px 4px;font-size:13px;opacity:.7;transition:opacity .2s}
  .filters .clear:hover{opacity:1;color:var(--khaki)}

  /* ---------- resumo ---------- */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;background:transparent;border:none;border-radius:0;margin-bottom:24px;overflow:visible;box-shadow:none}
  .summary div{padding:16px 18px 18px;background:linear-gradient(145deg,#242018 0%,var(--card-bg) 100%);position:relative;transition:all .25s ease;border-radius:var(--radius-lg);border:1px solid #3a3428;box-shadow:var(--shadow-md);overflow:hidden;text-align:center}
  .summary div:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--khaki-dk)}
  .summary div::before,.summary div::after{display:none}
  .summary .k{font:700 11px/1.3 var(--font-head);color:var(--khaki);text-transform:uppercase;letter-spacing:.05em;background:none;border:none;border-radius:0;padding:0;box-shadow:none}
  .summary .v{font:700 34px/1 var(--font-mono);margin-top:10px;font-variant-numeric:tabular-nums;color:var(--khaki-lt);text-shadow:0 0 24px rgba(200,187,154,.12);background:none;border:none;border-radius:0;padding:0;box-shadow:none}
  .summary .v.red{color:var(--red);text-shadow:0 0 24px rgba(224,85,85,.15)}
  .summary .v.amber{color:var(--amber);text-shadow:0 0 24px rgba(212,168,64,.15)}
  .summary .v.green{color:var(--green);text-shadow:0 0 24px rgba(74,173,122,.15)}
  .summary .s{font-size:11px;color:var(--ink-3);margin-top:6px;background:none;border:none;border-radius:0;padding:0;box-shadow:none}
  .summary div div{background:none!important;border:none!important;border-radius:0!important;padding:0!important;box-shadow:none!important}

  /* ---------- gráfico por batalhão ---------- */
  .panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);margin-bottom:24px;box-shadow:var(--shadow-md);overflow:hidden}
  .panel-h{display:flex;align-items:baseline;gap:14px;padding:16px 22px;border-bottom:1px solid var(--card-border);background:linear-gradient(180deg,#242018 0%,var(--card-bg) 100%)}
  .panel-h h2{font:700 15px/1.2 var(--font-head);margin:0;color:var(--khaki-lt);letter-spacing:.02em}
  .panel-h .hint{font-size:12px;color:var(--ink-3)}
  .panel-h .right{margin-left:auto;font-size:12px;color:var(--ink-2)}
  .bars{padding:14px 20px 8px}
  .bar-row{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:12px;padding:7px 6px;cursor:pointer;border-radius:6px;transition:background .15s}
  .bar-row:hover{background:rgba(163,151,117,.1)}
  .bar-row.sel{background:rgba(163,151,117,.14);box-shadow:inset 0 0 0 1px rgba(181,166,130,.15)}
  .bar-row .lbl{font:600 13px var(--font-head);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-row .lbl small{display:block;font:400 11px var(--font-body);color:var(--ink-3)}
  .bar{display:flex;height:24px;background:#161310;border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
  .bar i{display:block;height:100%;position:relative}
  .bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 60%)}
  .bar-row .tot{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;color:var(--ink-2);font-weight:600}
  .legend{display:flex;gap:18px;flex-wrap:wrap;padding:10px 20px 16px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--card-border)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px;box-shadow:0 1px 3px rgba(0,0,0,.3)}

  /* ---------- tabelas ---------- */
  .tbl-wrap{overflow:auto;max-height:70vh;border-radius:var(--radius-lg);border:1px solid var(--card-border);box-shadow:var(--shadow-md);background:var(--card-bg)}
  .tbl-wrap::-webkit-scrollbar{width:8px;height:8px}
  .tbl-wrap::-webkit-scrollbar-track{background:rgba(22,19,16,.6);border-radius:4px}
  .tbl-wrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--khaki-dk),#5a5040);border-radius:4px;border:1px solid rgba(0,0,0,.3)}
  .tbl-wrap::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--khaki),#6a6050)}
  .tbl-wrap::-webkit-scrollbar-corner{background:rgba(22,19,16,.6)}
  .tbl-wrap{scrollbar-width:thin;scrollbar-color:#5a5040 rgba(22,19,16,.6)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:12px 16px;border:none;text-align:left;vertical-align:middle}
  th{font:600 11px/1.2 var(--font-head);color:var(--khaki);background:#1a1710;position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid rgba(181,166,130,.15)}
  tfoot th{position:static;cursor:default;border-top:2px solid var(--khaki-dk);color:var(--ink);background:var(--card-bg)}
  th.sort-asc::after{content:" ▲";font-size:9px;color:var(--khaki-lt)}
  th.sort-desc::after{content:" ▼";font-size:9px;color:var(--khaki-lt)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--font-mono)}
  tbody tr{transition:background .15s}
  tbody tr:nth-child(even){background:rgba(40,36,26,.5)}
  tbody tr:nth-child(odd){background:transparent}
  tbody tr:hover{background:rgba(181,166,130,.08)}
  tr.click{cursor:pointer}
  tr.click:hover td{background:rgba(163,151,117,.1)}
  td.mono{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
  .tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.03em;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .tag.uso{background:linear-gradient(135deg,#2e2818,#3a3220);color:var(--khaki-lt);border:1px solid #4a4230}
  .tag.estoq{background:linear-gradient(135deg,#22201a,#2a2820);color:var(--khaki);border:1px solid #3a3828}
  .tag.pend{background:linear-gradient(135deg,#3a1a1a,#4a2020);color:#f08080;border:1px solid #5a2a2a}
  .tag.trans{background:linear-gradient(135deg,#3a2e14,#4a3a1a);color:#e8b84a;border:1px solid #5a4a22}
  .tag.other{background:linear-gradient(135deg,#2a2720,#32302a);color:#9a9480;border:1px solid #3a3830}
  .empty{padding:48px;text-align:center;color:var(--ink-3);font-style:italic}

  .pager{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--card-border);font-size:13px;color:var(--ink-2);background:rgba(30,27,20,.5)}
  .pager button{border:1px solid #3a3428;background:linear-gradient(180deg,#2a2620,#221f18);color:var(--ink);padding:7px 14px;border-radius:6px;font-weight:600;font-size:12px;transition:all .2s;box-shadow:var(--shadow-sm)}
  .pager button:hover:not(:disabled){background:linear-gradient(180deg,#3a3428,#2a2620);border-color:var(--khaki-dk);color:var(--khaki-lt)}
  .pager button:disabled{opacity:.35;cursor:default;box-shadow:none}
  .pager .spacer{flex:1}

  .breadcrumb{font-size:13px;margin-bottom:14px;color:var(--ink-2);padding:8px 14px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;display:inline-flex;align-items:center;gap:6px}
  .breadcrumb a{color:var(--khaki-lt);text-decoration:none;cursor:pointer;transition:color .2s}
  .breadcrumb a:hover{color:var(--khaki);text-decoration:underline}
  .breadcrumb b{color:var(--ink)}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  /* ---------- Quadro de Distribuição ---------- */
  .distrib-header{margin-bottom:24px}
  .distrib-header h2{font:700 20px/1.2 var(--font-head);margin:0 0 6px;color:var(--khaki-lt);letter-spacing:.02em}
  .distrib-header span{font-size:13px;color:var(--ink-3)}
  .distrib-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
  .distrib-card{background:linear-gradient(145deg,#242018 0%,var(--card-bg) 100%);border:1px solid #3a3428;border-radius:var(--radius-lg);padding:20px 16px 22px;text-align:center;box-shadow:var(--shadow-md);transition:all .25s ease;position:relative;overflow:hidden}
  .distrib-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--khaki-dk),var(--khaki),var(--khaki-dk));opacity:.6}
  .distrib-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--khaki-dk)}
  .distrib-card .dc-title{font:700 11px/1.3 var(--font-head);color:var(--khaki);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .distrib-card .dc-value{font:700 44px/1 var(--font-mono);color:var(--khaki-lt);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(200,187,154,.12)}
  @media (max-width:1100px){.distrib-grid{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:740px){.distrib-grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:480px){.distrib-grid{grid-template-columns:1fr}}

  .desc-cell{max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:900px){
    .grid-2{grid-template-columns:1fr}
    .bar-row{grid-template-columns:110px 1fr 70px}
    header,main,nav.tabs{padding-left:14px;padding-right:14px}
    .desc-cell{max-width:180px}
  }
  @media (prefers-reduced-motion:no-preference){
    .bar i{transition:width .35s ease}
  }
  @media print{
    header .btn,nav.tabs,.filters,.pager{display:none}
    .header-khaki,.lock-wrap,.footer-bar{display:none}
    :root{--ink:#1B2A4A;--ink-2:#4A5A78;--ink-3:#8A94A8;--line:#D6DAE3;--paper:#fff;--white:#fff;--red:#B3202E;--amber:#C98A1D}
    body{background:#fff;color:#1B2A4A}
    .summary .v{color:#1B2A4A}
    .panel-h h2{color:#1B2A4A}
    th{background:#f3f5f8;color:#4A5A78}
    .tag.uso{background:#E5EAF3;color:#1B2A4A}.tag.estoq{background:#E8EEF7;color:#3E5A8A}.tag.pend{background:#FBE9EB;color:#B3202E}.tag.trans{background:#FBF1DE;color:#8A5E0D}.tag.other{background:#ECECEC;color:#555}
    .panel,.summary{break-inside:avoid}
  }

  /* ---------- pulsing status dot (data freshness) ---------- */
  .status-dot{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .status-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse-dot 2s infinite;flex-shrink:0}
  @keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.5;box-shadow:0 0 4px var(--green)}}

  /* ---------- section label with extending line ---------- */
  .section-label{display:flex;align-items:center;gap:12px;font:700 13px/1 var(--font-head);color:var(--khaki);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 16px;padding:0}
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--card-border),transparent)}

  /* ---------- alert rows with colored dots ---------- */
  .alert-row{display:flex;align-items:flex-start;padding:10px 14px;border-radius:6px;margin-bottom:6px;font-size:12px;gap:10px;border:1px solid;line-height:1.5}
  .alert-row.a-red{background:rgba(224,85,85,.06);border-color:rgba(224,85,85,.15)}
  .alert-row.a-amber{background:rgba(212,168,64,.06);border-color:rgba(212,168,64,.15)}
  .alert-row.a-green{background:rgba(74,173,122,.06);border-color:rgba(74,173,122,.15)}
  .alert-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
  .alert-dot.d-red{background:var(--red);box-shadow:0 0 6px var(--red)}
  .alert-dot.d-amber{background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .alert-dot.d-green{background:var(--green);box-shadow:0 0 6px var(--green)}

  /* ---------- thin progress bars ---------- */
  .progress-bar{height:5px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin-top:6px}
  .progress-fill{height:100%;border-radius:99px;transition:width .4s ease}
  .progress-fill.pf-green{background:linear-gradient(90deg,#3a8a5a,var(--green))}
  .progress-fill.pf-amber{background:linear-gradient(90deg,#b89030,var(--amber))}
  .progress-fill.pf-red{background:linear-gradient(90deg,#a03030,var(--red))}
  .progress-fill.pf-khaki{background:linear-gradient(90deg,var(--khaki-dk),var(--khaki))}

  /* ---------- sub-grid status mini-cards ---------- */
  .sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .sub-item{background:rgba(255,255,255,.03);border:1px solid var(--card-border);border-radius:6px;padding:10px 12px}
  .sub-item .si-label{font:600 10px/1.2 var(--font-head);color:var(--khaki-dk);text-transform:uppercase;letter-spacing:.05em}
  .sub-item .si-value{font:700 20px/1.2 var(--font-mono);color:var(--khaki-lt);margin-top:4px;font-variant-numeric:tabular-nums}
  .sub-item .si-value.si-red{color:var(--red)}
  .sub-item .si-value.si-amber{color:var(--amber)}
  .sub-item .si-value.si-green{color:var(--green)}

  /* ---------- tema claro ---------- */
  body.light{
    --ink:#2a2418;--ink-2:#5a5040;--ink-3:#7a7058;
    --line:#d8d0c0;--paper:#f0ece4;--white:#fff;
    --card-bg:#fff;--card-border:#d0c8b8;
    --shadow-sm:0 1px 3px rgba(0,0,0,.08);
    --shadow-md:0 4px 12px rgba(0,0,0,.1);
    --shadow-lg:0 8px 24px rgba(0,0,0,.12);
    --red:#c03030;--amber:#b08020;--green:#2a8a50;
    --khaki:#8a7e60;--khaki-lt:#6a6050;--khaki-dk:#a09480;
    --glow-khaki:rgba(140,130,100,.08);
  }
  body.light header{background:linear-gradient(180deg,rgba(220,210,190,.95) 0%,rgba(200,190,170,.98) 100%);color:#2a2418;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  body.light nav.tabs{background:linear-gradient(180deg,#e8e0d0 0%,#ddd6c8 100%);border-bottom-color:#c0b8a0}
  body.light nav.tabs button{color:#8a7e60}
  body.light nav.tabs button.active{color:#2a2418;border-bottom-color:#8a7e60;background:rgba(140,130,100,.08)}
  body.light th{background:#f5f0e8;color:#5a5040;border-bottom-color:#d0c8b8}
  body.light tbody tr:nth-child(even){background:rgba(220,210,190,.3)}
  body.light tbody tr:hover{background:rgba(140,130,100,.1)}
  body.light .summary div{background:linear-gradient(145deg,#fff 0%,#f8f4ec 100%);border-color:#d0c8b8}
  body.light .summary div:hover{border-color:#b0a890;box-shadow:var(--shadow-lg)}
  body.light .summary .v{color:#2a2418;text-shadow:none}
  body.light .summary .v.red{color:var(--red)}
  body.light .summary .v.amber{color:var(--amber)}
  body.light .distrib-card{background:linear-gradient(145deg,#fff 0%,#f8f4ec 100%);border-color:#d0c8b8}
  body.light .distrib-card:hover{border-color:#b0a890}
  body.light .distrib-card .dc-value{color:#2a2418;text-shadow:none}
  body.light .panel{background:#fff;border-color:#d0c8b8}
  body.light .panel-h{background:linear-gradient(180deg,#f5f0e8 0%,#fff 100%);border-bottom-color:#d0c8b8}
  body.light .tbl-wrap{background:#fff;border-color:#d0c8b8}
  body.light .filters{background:#fff;border-color:#d0c8b8}
  body.light select,body.light input[type=search]{background:#f8f4ec;border-color:#d0c8b8;color:#2a2418}
  body.light select option{background:#f8f4ec;color:#2a2418}
  body.light .filters select,.light .filters input{background:#f8f4ec;border-color:#d0c8b8;color:#2a2418;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
  body.light .filters select:hover,.light .filters input:hover{border-color:#b0a890}
  body.light .filters select:focus,.light .filters input:focus{border-color:#8a7e60;box-shadow:0 0 0 3px rgba(140,130,100,.12),inset 0 1px 2px rgba(0,0,0,.06)}
  body.light .bar{background:#e8e0d0}
  body.light .btn{background:linear-gradient(180deg,#f0ece4,#e0d8c8);border-color:#c0b8a0;color:#2a2418}
  body.light .btn:hover{background:linear-gradient(180deg,#e8e0d0,#d8d0c0)}
  body.light .btn.primary{background:linear-gradient(180deg,#8a7e60,#6a6050);color:#fff}
  body.light .alert-row.a-red{background:rgba(192,48,48,.08);border-color:rgba(192,48,48,.2)}
  body.light .alert-row.a-amber{background:rgba(176,128,32,.08);border-color:rgba(176,128,32,.2)}
  body.light .alert-row.a-green{background:rgba(42,138,80,.08);border-color:rgba(42,138,80,.2)}
  body.light .sub-item{background:rgba(0,0,0,.03);border-color:#d0c8b8}
  body.light .tbl-wrap::-webkit-scrollbar-track{background:rgba(220,210,190,.5)}
  body.light .tbl-wrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#b0a890,#9a8e70);border-color:rgba(0,0,0,.1)}
  body.light .tbl-wrap{scrollbar-color:#a09480 rgba(220,210,190,.5)}
  body.light .section-label{color:#8a7e60}
  body.light .section-label::after{background:linear-gradient(90deg,#d0c8b8,transparent)}
  body.light .header-khaki{background:linear-gradient(180deg,#e8e0d0,#ddd6c8);border-bottom-color:#c0b8a0}
  body.light .tag{box-shadow:0 1px 2px rgba(0,0,0,.1)}
  body.light #btnContraste{background:linear-gradient(180deg,#3a3428,#2a2418);color:#e8e4dc;border-color:#5a5040}
  body.light .progress-bar{background:rgba(0,0,0,.08)}
  body.light ::selection{background:rgba(140,130,100,.3);color:#000}

  @media print{
    body::before{display:none}
    .status-dot::before{display:none}
  }
</style>
</head>

<script>
/* ============================================================
   Carregamento automático
   ------------------------------------------------------------
   1) Se a página estiver publicada em um servidor (intranet),
      ela procura os arquivos abaixo na pasta "dados/" ao lado
      do HTML e carrega sozinha. Salve a exportação de cada mês
      com esses nomes fixos.
   2) Se o HTML tiver dados embutidos (gerado por gerar_painel.py),
      eles são usados sem precisar de servidor.
   3) Caso contrário, aparece o botão "Carregar planilhas".
   ============================================================ */
const ARQUIVOS = [
  'dados/mapa-carga.xlsx',
  'dados/guias-nao-confirmadas.xlsx',
  'dados/qdl.xlsx',
  'dados/drones.xlsx'
];

/* ============================================================
   Estado
   ============================================================ */
const S = {
  mapa:null,   // {rows:[], ref:Date|null, file:string}
  guias:null,  // {rows:[], file:string}
  qdl:null,    // {rows:[], file:string}
  drones:null, // {rows:[], file:string}
  tab:'mapa',
  loaded:[],   // mensagens sobre arquivos lidos
  fonte:'',    // 'arquivo' | 'servidor' | 'embutido'
  geradoEm:null,
  f:{bat:'',unid:'',dest:'',mun:'',q:''},
  g:{bat:'',dest:'',q:''},
  q:{bat:'',grp:'arm',mun:''},
  db:{bat:'',unid:'',dest:'',mun:'',q:''},  // filtros Quadro de Distribuição
  iv:{almox:'',mat:'',q:''},  // filtros Inventário
  d:{unid:'',q:''},
  drill:null,  // unidade em detalhe (mapa)
  sort:{mapaU:['count','desc'],mapaI:['unid','asc'],guias:['destino','asc'],qdl:['mun','asc'],drones:['unid','asc'],inv:['mat','asc']},
  page:1, per:50
};

const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmtN   = new Intl.NumberFormat('pt-BR');
const brl = v => fmtBRL.format(v||0);
const n   = v => fmtN.format(v||0);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================================================
   Leitura das planilhas
   ============================================================ */
function battalion(u){
  u = String(u||'');
  const r = u.match(/(\d+ BPM|\d+ CIA PM IND|EM4RPM|\d+ RPM)/);
  if(r){
    const k = r[1];
    if(k==='EM4RPM') return 'EM 4ª RPM';
    if(/^\d+ RPM$/.test(k)) return 'Órgãos 4ª RPM';
    return k.replace(/^(\d+) BPM$/,'$1º BPM').replace(/^(\d+) CIA PM IND$/,'$1ª Cia PM Ind');
  }
  if(/CAS\b|SAUDE/.test(u)) return 'Saúde (CAS)';
  return 'Outros';
}
function destClass(d){
  d=String(d||'');
  if(d==='EM USO') return 'uso';
  if(d==='ESTOCADO') return 'estoq';
  if(d.startsWith('EM PEND')) return 'pend';
  if(d==='EM TRANSITO') return 'trans';
  return 'other';
}
const DEST_COLOR = {uso:'#1B2A4A',estoq:'#7C93B8',pend:'#B3202E',trans:'#C98A1D',other:'#B9BEC9'};
const DEST_NAME  = {uso:'Em uso',estoq:'Estocado',pend:'Em pendência',trans:'Em trânsito',other:'Outros'};

function wbSheets(wb){
  return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true})}));
}
function findHeader(rows,mustHave){
  for(let i=0;i<Math.min(rows.length,20);i++){
    const r=rows[i]||[];
    if(mustHave.every(h=>r.some(c=>typeof c==='string' && c.trim()===h))) return i;
  }
  return -1;
}
function colIndex(header){
  const m={};
  header.forEach((h,i)=>{ if(typeof h==='string') m[h.trim()]=i; });
  return m;
}
function findRefDate(rows){
  for(let i=0;i<6;i++){
    for(const c of (rows[i]||[])){
      if(Object.prototype.toString.call(c)==='[object Date]') return c;
      if(typeof c==='number' && c>40000 && c<60000 && typeof XLSX!=='undefined'){ // serial Excel
        const d=XLSX.SSF.parse_date_code(c); return new Date(d.y,d.m-1,d.d);
      }
      if(typeof c==='string'){
        const d=toDate(c); if(d) return d;
        const m=c.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
      }
    }
  }
  return null;
}
function num(v){ if(v==null||v==='') return 0; if(typeof v==='number') return v; const s=String(v).replace(/\./g,'').replace(',','.'); const x=parseFloat(s); return isNaN(x)?0:x; }
function str(v){ return v==null?'':String(v).trim(); }

function parseMapa(rows,file){
  const hi=findHeader(rows,['Unidade Responsável','Número Patrimônio']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const pat=str(r[c['Número Patrimônio']]); if(!pat) continue;
    const unid=str(r[c['Unidade Responsável']]);
    out.push({
      pat, unid, bat:battalion(unid),
      cod:str(r[c['Código Unidade Responsável']]),
      elem:str(r[c['Código Elemento Item Despesa']]),
      tipo:str(r[c['Tipo Bem']]),
      mat:str(r[c['Material']]).replace(/\s*-\s*$/,''),
      dest:str(r[c['Destinação do Bem']]),
      marca:str(r[c['Marca']]), modelo:str(r[c['Modelo']]),
      serie:str(r[c['Número Série']]), placa:str(r[c['Placa']]),
      valor:num(r[c['Valor Bem']]),
      mun:str(r[c['Nome Município Unidade - Responsável']])
    });
  }
  return {rows:out, ref:findRefDate(rows), file};
}
function parseGuias(rows,file){
  const hi=findHeader(rows,['Unidade Destino','Número Patrimônio']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const pat=str(r[c['Número Patrimônio']]); if(!pat) continue;
    const destino=str(r[c['Unidade Destino']]);
    out.push({
      pat, mat:str(r[c['Material']]).replace(/\s*-\s*$/,''),
      origem:str(r[c['Nome Unidade - Proprietário']]),
      gerencial:str(r[c['Unidade Gerencial']]),
      doc:str(r[c['Documento Última Movimentação']]),
      dest:str(r[c['Destinação do Bem']]),
      elem:str(r[c['Código Elemento Item Despesa']]),
      placa:str(r[c['Placa']]),
      destino, bat:battalion(destino),
      codDestino:str(r[c['Destino']]),
      valor:num(r[c['Valor Bem']])
    });
  }
  return {rows:out, file};
}

/* ---- QDL: uma linha por unidade x município ---- */
const QDL_GROUPS={
  arm:{name:'Armamento e proteção',cols:[['Arma de porte prevista','Arma de porte'],['Arma de Alta Energia prevista','Alta energia'],['Espingarda prevista','Espingarda'],['AINM prevista','AINM'],['Escudo Balístico previsto','Escudo bal.'],['Capacete Balístico previsto','Capacete bal.'],['Coletes previsto','Coletes'],['Etilômetro previsto','Etilômetro'],['Capacete para motocilista previsto','Cap. moto']]},
  via:{name:'Viaturas',cols:[['VP Tipo 1 POG prevista','VP Tipo 1 POG'],['VP Tipo 2 prevista','VP Tipo 2'],['BSC prevista','BSC'],['BCM prevista','BCM'],['Motocicleta prevista','Motocicleta'],['VP PROERD prevista','PROERD'],['VP Escolar prevista','Escolar'],['VP PVD prevista','PVD'],['VP SIPOM prevista','SIPOM'],['VP Coord Estrat prevista','Coord. Estrat.'],['VP Coord Controle prevista','Coord. Controle'],['TPO previsto','TPO'],['TC/Adm prevista','TC/Adm'],['Ambulância prevista','Ambulância'],['VP CTPM prevista','VP CTPM'],['TPO CTPM previsto','TPO CTPM'],['REDEC prevista','REDEC']]},
  tic:{name:'Comunicação e informática',cols:[['Rádio Móvel previsto','Rádio móvel'],['HT previsto','HT'],['Computador previsto','Computador'],['Notebook previsto','Notebook']]}
};
const QDL_ALL_COLS=[].concat(...Object.values(QDL_GROUPS).map(g=>g.cols));
function qdlBat(p){
  p=String(p||'').trim();
  if(/^4 RPM$/.test(p)) return 'EM 4ª RPM';
  if(/RMOP/.test(p)) return 'Reserva (RMOP)';
  const r=p.match(/^(\d+) BPM/); if(r) return r[1]+'º BPM';
  const c=p.match(/^(\d+) CIA PM IND/); if(c) return c[1]+'ª Cia PM Ind';
  return p;
}
function parseQDL(sheets,file){
  const sh=sheets.find(x=>x.name.trim().toUpperCase()==='UDI')||sheets[0];
  const name=sh.name, rows=sh.rows;
  const hi=findHeader(rows,['Arma de porte prevista']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const unid=str(r[c['UNIDADE']]); if(!unid) continue;
    const o={unid, principal:str(r[c['PRINCIPAL']]), bat:qdlBat(r[c['PRINCIPAL']]), siad:str(r[c['SIAD']]), mun:str(r[c['MUNICÍPIO']]), efetivo:num(r[c['EFETIVO']])};
    QDL_ALL_COLS.forEach(([k])=>{ o[k]=num(r[c[k]]); });
    o.viaturas=QDL_GROUPS.via.cols.reduce((a,[k])=>a+o[k],0);
    o.radios=o['Rádio Móvel previsto']+o['HT previsto'];
    out.push(o);
  }
  return {rows:out,file,sheet:name};
}

/* ---- Drones ---- */
function toDate(v){
  if(Object.prototype.toString.call(v)==='[object Date]') return isNaN(v)?null:v;
  if(typeof v==='number'&&v>20000&&v<80000&&typeof XLSX!=='undefined'){const d=XLSX.SSF.parse_date_code(v);return new Date(d.y,d.m-1,d.d);}
  if(typeof v==='string'){
    const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
    const i=v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(i) return new Date(+i[1],+i[2]-1,+i[3]);
  }
  return null;
}
function parseDrones(rows,file){
  const hi=findHeader(rows,['PREFIXO','VALIDADE SISANT']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const g=(r,k)=>r[c[k]];
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const unid=str(g(r,'UNIDADE')), prefixo=str(g(r,'PREFIXO')), pat=str(g(r,'Nº DE PATRIMÔNIO'));
    if(!unid&&!prefixo&&!pat) continue;
    out.push({
      unid, prefixo, pat, sei:str(g(r,'PROCESSO SEI')), codUnid:str(g(r,'CODIGO UNIDADE')),
      modelo:str(g(r,'MARCA / MODELO')), serie:str(g(r,'Nº DE SÉRIE')),
      status:str(g(r,'STATUS')), sit:str(g(r,'SITUAÇÃO')),
      ultimoVoo:toDate(g(r,'ÚLTIMO VOO')), voos:num(g(r,'TOTAL DE VOOS')),
      sisant:toDate(g(r,'VALIDADE SISANT')), sisantRaw:str(g(r,'VALIDADE SISANT')),
      aquis:toDate(g(r,'DATA DA AQUISIÇÃO')), aquisRaw:str(g(r,'DATA DA AQUISIÇÃO')),
      batOk:num(g(r,'QUANTIDADE DE BATERIAS EM CONDIÇÕES DE USO')), batBx:num(g(r,'QUANTIDADE DE BATERIAS BAIXADAS')),
      cidade:str(g(r,'CIDADE')), endereco:str(g(r,'ENDEREÇO')),
      pg:str(g(r,'P/G')), nome:str(g(r,'NOME')), npm:str(g(r,'Nº PM')), cia:str(g(r,'CIA')),
      contato:str(g(r,'CONTATO')), email:str(g(r,'EMAIL')), obs:str(g(r,'OBS')),
      assin:str(g(r,'Assinaturas'))
    });
  }
  return {rows:out,file};
}
function sisantState(d){
  if(!d.sisant) return {cls:'other',txt:d.sisantRaw||'sem registro'};
  const today=new Date(); today.setHours(0,0,0,0);
  const days=Math.round((d.sisant-today)/864e5);
  const dt=d.sisant.toLocaleDateString('pt-BR');
  if(days<0) return {cls:'pend',txt:`${dt} · vencido há ${n(-days)} d`};
  if(days<=60) return {cls:'trans',txt:`${dt} · vence em ${n(days)} d`};
  return {cls:'uso',txt:dt};
}

/* ---- Inventário de Material de Consumo ---- */
function parseInventario(rows,file){
  const hi=findHeader(rows,['Unidade Almoxarifado','Item Material','Qtde Estoque']);
  if(hi<0) return null;
  const c=colIndex(rows[hi]);
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const almox=str(r[c['Unidade Almoxarifado']]); if(!almox||almox==='Unidade Almoxarifado') continue;
    const mat=str(r[c['Material']]).replace(/\s*-\s*$/,'');
    out.push({
      almox, mat,
      codAlmox:str(r[c['Código Unidade Almoxarifado - Numér']]),
      codElem:str(r[c['Código Elemento Item Despesa']]),
      codItem:str(r[c['Código Item Material - Numérico']]),
      codUnidDistrib:str(r[c['Código Unidade Distribuição']]),
      convenio:str(r[c['Convênio']]),
      item:str(r[c['Item Material']]),
      qtdEst:num(r[c['Qtde Estoque']]),
      qtdRes:num(r[c['Qtde Reservada Análise']]),
      qtdDisp:num(r[c['Qtde Disponível']]),
      valor:num(r[c['Valor Total']])
    });
  }
  return {rows:out,file};
}

function ingest(name,sheets){
  const rows=sheets[0].rows;
  const m=parseMapa(rows,name);
  if(m){ S.mapa=m; return `${name}: mapa carga, ${n(m.rows.length)} itens`; }
  const g=parseGuias(rows,name);
  if(g){ S.guias=g; return `${name}: guias, ${n(g.rows.length)} itens`; }
  const q=parseQDL(sheets,name);
  if(q){ S.qdl=q; return `${name}: QDL, ${n(q.rows.length)} linhas`; }
  const d=parseDrones(rows,name);
  if(d){ S.drones=d; return `${name}: drones, ${n(d.rows.length)} aeronaves`; }
  const inv=parseInventario(rows,name);
  if(inv){ S.inventario=inv; return `${name}: inventário, ${n(inv.rows.length)} itens`; }
  return null;
}
function afterLoad(){
  S.drill=null; S.page=1;

}
async function loadFiles(list){
  if(typeof XLSX==='undefined'){ alert('Sem acesso à internet a leitura de planilhas avulsas não funciona; os dados embutidos continuam disponíveis.'); return; }
  S.loaded=[]; S.fonte='arquivo';
  for(const f of list){
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:true});

    }catch(e){ S.loaded.push({ok:false,msg:`${f.name}: erro ao ler (${e.message})`}); }
  }
  afterLoad();
}

/* dados cifrados (gerar_painel.py --senha) */
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function decifrar(pack,senha){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(senha),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(pack.salt),iterations:pack.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(pack.iv)},key,b64(pack.dados));
  let bytes=new Uint8Array(plain);
  if(pack.gzip){
    const ds=new DecompressionStream('gzip');
    const resp=new Response(new Blob([bytes]).stream().pipeThrough(ds));
    bytes=new Uint8Array(await resp.arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* arquivos na pasta dados/ (só funciona servido por http) */
async function loadFromServer(){
  if(location.protocol==='file:') return false;
  let any=false; const msgs=[];
  for(const url of ARQUIVOS){
    try{
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok) continue;
      const wb=XLSX.read(await res.arrayBuffer(),{type:'array',cellDates:true});
      const msg=ingest(url,wbSheets(wb));
      msgs.push(msg?{ok:true,msg}:{ok:false,msg:`${url}: não reconhecido`});
      if(msg) any=true;
    }catch(e){ /* arquivo ausente: ignora */ }
  }
  if(any){ S.loaded=msgs; S.fonte='servidor'; }
  return any;
}
async function autoLoad(){
  if(lockScreen()) return;
  const ok = await loadFromServer() || loadEmbedded();
  if(ok) afterLoad();
}

function mapaFiltered(){
  const f=S.f, q=f.q.toLowerCase();
  return S.mapa.rows.filter(r=>
    (!f.bat || r.bat===f.bat) &&
    (!f.unid|| r.unid===f.unid) &&
    (!f.dest|| destClass(r.dest)===f.dest) &&
    (!f.mun || r.mun===f.mun) &&
    (!q || r.mat.toLowerCase().includes(q) || r.pat.includes(q) || r.serie.toLowerCase().includes(q) || r.placa.toLowerCase().includes(q) || r.modelo.toLowerCase().includes(q) || r.marca.toLowerCase().includes(q) || r.cod.toLowerCase().includes(q))
  );
}
function guiasFiltered(){
  const g=S.g, q=g.q.toLowerCase();
  return S.guias.rows.filter(r=>
    (!g.bat || r.bat===g.bat) &&
    (!q || r.mat.toLowerCase().includes(q) || r.pat.includes(q) || r.destino.toLowerCase().includes(q) || r.origem.toLowerCase().includes(q) || r.doc.toLowerCase().includes(q))
  );
}
function groupBy(rows,key){
  const m=new Map();
  for(const r of rows){
    const k=r[key];
    let g=m.get(k);
    if(!g){ g={key:k,count:0,valor:0,uso:0,estoq:0,pend:0,trans:0,other:0,cod:r.cod||''}; m.set(k,g); }
    g.count++; g.valor+=r.valor; g[destClass(r.dest)]++;
    if(!g.cod && r.cod) g.cod=r.cod;
  }
  return [...m.values()];
}
function sortRows(rows,[k,dir]){
  const s=dir==='asc'?1:-1;
  return rows.slice().sort((a,b)=>{
    const x=a[k],y=b[k];
    if(typeof x==='number'&&typeof y==='number') return (x-y)*s;
    return String(x??'').localeCompare(String(y??''),'pt-BR',{numeric:true})*s;
  });
}
const uniq=(rows,k)=>[...new Set(rows.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
const BAT_ORDER=['EM 4ª RPM','Órgãos 4ª RPM','2º BPM','21º BPM','27º BPM','47º BPM','68º BPM','4ª Cia PM Ind','10ª Cia PM Ind','Saúde (CAS)','Outros'];
const batSort=(a,b)=>{const i=BAT_ORDER.indexOf(a),j=BAT_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b);};

    </table></div>
    ${pager(pages)}` : `<div class="empty">Escolha uma unidade acima, use a busca ou filtre por situação para listar os itens individualmente.</div>`}

function renderQDL(){

  const grp=QDL_GROUPS[q.grp];

    <button class="clear" id="qClear">Limpar filtros</button>
  </div>

  <div class="summary">
    <div><div class="k">Efetivo previsto</div><div class="v">${n(sum('efetivo'))}</div><div class="s">${n(rows.length)} linhas · ${n(new Set(rows.map(r=>r.mun)).size)} municípios</div></div>

      <tbody>${byBat.map(b=>`<tr class="click" data-qbat="${esc(b.bat)}"><td>${esc(b.bat)}</td><td class="num">${n(b.n)}</td><td class="num">${n(b.efetivo)}</td><td class="num">${n(b['Arma de porte prevista'])}</td><td class="num">${n(b['Arma de Alta Energia prevista'])}</td><td class="num">${n(b.viaturas)}</td><td class="num">${n(b['Motocicleta prevista'])}</td><td class="num">${n(b['Rádio Móvel previsto'])}</td><td class="num">${n(b['HT previsto'])}</td><td class="num">${n(b['Computador previsto'])}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`}

  <div class="section-label">Detalhamento por município</div>

      <tfoot><tr><th>Total</th><th></th><th class="num">${n(sum('efetivo'))}</th>${grp.cols.map(([k])=>`<th class="num">${n(sum(k))}</th>`).join('')}</tr></tfoot>
    </table></div>
  </div>`;
}

    (!d.unid || r.unid===d.unid) &&

  );

function renderDistrib(){

    <span class="status-dot">${esc(scope)} · ${n(total)} itens classificados</span>

  <div class="section-label">Distribuição por categoria</div>

    ${counts.map(c=>{const pctV=total?Math.round(c.qtd/total*100):0;return `<div class="distrib-card">

/* ---------- Drones ---------- */
function dronesFiltered(){ const d=S.d,q=d.q.toLowerCase(); return S.drones.rows.filter(r=>(!d.unid||r.unid===d.unid)&&(!q||[r.prefixo,r.modelo,r.pat,r.serie,r.nome,r.cidade,r.sei].some(v=>v.toLowerCase().includes(q)))); }
function renderDrones(){
  const all=S.drones.rows, rows=dronesFiltered(), d=S.d;
  const today=new Date(); today.setHours(0,0,0,0);
  const emUso=rows.filter(r=>r.sit==='EM USO').length;
  const baixados=rows.filter(r=>/BAIX/.test(r.sit)||/BAIX/.test(r.status)).length;
  const vencidos=rows.filter(r=>r.sisant&&r.sisant<today&&!/BAIX/.test(r.sit)).length;
  const vencendo=rows.filter(r=>r.sisant&&r.sisant>=today&&(r.sisant-today)/864e5<=60).length;
  const incompletos=rows.filter(r=>!r.pat||!r.modelo||!r.sisant).length;
  const batOk=rows.reduce((a,r)=>a+r.batOk,0), batBx=rows.reduce((a,r)=>a+r.batBx,0);
  const sorted=sortRows(rows,S.sort.drones);
  const fd=v=>v?v.toLocaleDateString('pt-BR'):'';
  return `
  <div class="filters">
    <label>Unidade<select id="dUnid"><option value="">Todas</option>${uniq(all,'unid').map(u=>`<option ${d.unid===u?'selected':''}>${esc(u)}</option>`).join('')}</select></label>
    <label>Buscar<input type="search" id="dQ" value="${esc(d.q)}" placeholder="prefixo, modelo, patrimônio, série, responsável"></label>
    <button class="clear" id="dClear">Limpar filtros</button>
  </div>

  <div class="summary">
    <div><div class="k">Aeronaves</div><div class="v">${n(rows.length)}</div><div class="s">em uso ${n(emUso)} · baixadas ${n(baixados)}</div></div>
    <div><div class="k">SISANT vencido</div><div class="v ${vencidos?'red':''}">${n(vencidos)}</div><div class="s">${vencendo?`${n(vencendo)} vencem nos próximos 60 dias`:'cadastro na ANAC a renovar'}</div></div>
    <div><div class="k">Cadastro incompleto</div><div class="v ${incompletos?'amber':''}">${n(incompletos)}</div><div class="s">sem patrimônio, modelo ou validade</div></div>

    <div><div class="k">Voos registrados</div><div class="v">${n(rows.reduce((a,r)=>a+r.voos,0))}</div></div>
  </div>

  ${vencidos?`<div class="alert-row a-red"><span class="alert-dot d-red"></span><span><b>${n(vencidos)}</b> aeronave(s) com SISANT vencido. Providenciar renovação junto à ANAC.</span></div>`:''}
  ${vencendo?`<div class="alert-row a-amber"><span class="alert-dot d-amber"></span><span><b>${n(vencendo)}</b> aeronave(s) com SISANT vencendo nos próximos 60 dias.</span></div>`:''}
  ${incompletos?`<div class="alert-row a-amber"><span class="alert-dot d-amber"></span><span><b>${n(incompletos)}</b> aeronave(s) com cadastro incompleto (sem patrimônio, modelo ou validade).</span></div>`:''}

  <div class="section-label">Frota completa</div>
  <div class="panel">
    <div class="panel-h"><h2>Frota de aeronaves remotamente pilotadas</h2><span class="hint">hoje: ${today.toLocaleDateString('pt-BR')}</span><span class="right"><a style="cursor:pointer;text-decoration:underline" id="csv">Exportar CSV</a></span></div>
    <div class="tbl-wrap"><table>
      <thead><tr>${th('unid','Unidade','drones')}${th('prefixo','Prefixo','drones')}${th('modelo','Modelo','drones')}${th('pat','Patrimônio','drones')}${th('sit','Situação','drones')}${th('sisant','Validade SISANT','drones')}${th('ultimoVoo','Último voo','drones')}${th('voos','Voos','drones','num')}${th('batOk','Baterias','drones','num')}${th('nome','Responsável','drones')}<th>SEI</th><th>Obs.</th></tr></thead>
      <tbody>${sorted.map(r=>{const st=sisantState(r);return `<tr>
        <td>${esc(r.unid)}<br><small style="color:var(--ink-3)">${esc(r.cidade)}</small></td>
        <td class="mono">${esc(r.prefixo)}</td>

        <td><small>${esc(r.obs)}</small></td></tr>`;}).join('')||`<tr><td colspan="12" class="empty">Nenhuma aeronave com os filtros atuais.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

/* ---------- utilitários de render ---------- */
function pct(a,b){ return b? (a/b*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—'; }
function th(key,label,sortKey,cls=''){
  const [k,d]=S.sort[sortKey];
  return `<th class="${cls} ${k===key?'sort-'+d:''}" data-sort="${sortKey}" data-key="${key}">${label}</th>`;
}
function pager(pages){
  if(pages<=1) return '';
  return `<div class="pager"><span>Página ${S.page} de ${pages}</span><span class="spacer"></span>
    <button data-pg="-1" ${S.page<=1?'disabled':''}>Anterior</button><button data-pg="1" ${S.page>=pages?'disabled':''}>Próxima</button></div>`;
}
function exportCSV(rows,cols,name){
  const head=cols.map(c=>c[1]).join(';');
  const body=rows.map(r=>cols.map(c=>{const v=r[c[0]];return typeof v==='number'?String(v).replace('.',','):'"'+String(v??'').replace(/"/g,'""')+'"';}).join(';')).join('\n');
  const blob=new Blob(['\ufeff'+head+'\n'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}

/* ============================================================

   ============================================================ */
function bindDrop(){
  const d=$('drop'); if(!d) return;
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',e=>loadFiles([...e.dataTransfer.files]));
}
function bindCommon(){
  bindDrop();
  const on=(id,ev,fn)=>{const el=$(id); if(el) el.addEventListener(ev,fn);};
  const setF=(k,v)=>{S.f[k]=v; if(k==='bat') S.f.unid=''; S.page=1; S.drill=null; render();};

    }else if(S.tab==='drones'){
      exportCSV(dronesFiltered().map(r=>({...r,sisant:r.sisant?r.sisant.toLocaleDateString('pt-BR'):r.sisantRaw,ultimoVoo:r.ultimoVoo?r.ultimoVoo.toLocaleDateString('pt-BR'):'',aquis:r.aquis?r.aquis.toLocaleDateString('pt-BR'):r.aquisRaw})),[['unid','Unidade'],['prefixo','Prefixo'],['modelo','Modelo'],['pat','Patrimônio'],['serie','Série'],['status','Status'],['sit','Situação'],['sisant','Validade SISANT'],['ultimoVoo','Último voo'],['voos','Voos'],['batOk','Baterias OK'],['batBx','Baterias baixadas'],['aquis','Aquisição'],['cidade','Cidade'],['pg','P/G'],['nome','Responsável'],['contato','Contato'],['sei','Processo SEI'],['obs','Obs']],'drones.csv');
    }else if(S.tab==='inventario'){
      exportCSV(invFiltered(),[['almox','Unidade Almoxarifado'],['mat','Material'],['item','Item Material'],['codElem','Cód. Elemento'],['codItem','Cód. Item'],['convenio','Convênio'],['qtdEst','Qtde Estoque'],['qtdRes','Qtde Reservada'],['qtdDisp','Qtde Disponível']],'inventario-filtrado.csv');
    }else{
      exportCSV(guiasFiltered(),[['pat','Patrimônio'],['mat','Material'],['origem','Origem'],['gerencial','Unidade gerencial'],['destino','Destino'],['codDestino','Cód. destino'],['doc','Documento'],['valor','Valor']],'guias-nao-confirmadas.csv');
    }
  });
}
function refocus(id){ const el=$(id); if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; } }
function debounce(fn,ms){ let t; return e=>{clearTimeout(t); t=setTimeout(()=>fn(e),ms);}; }

$('btnLoad').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{ loadFiles([...e.target.files]); e.target.value=''; });
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.page=1;render();}));
/* arrastar em qualquer lugar da página */
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{ if(!e.target.closest('#drop')){ e.preventDefault(); if(e.dataTransfer.files.length) loadFiles([...e.dataTransfer.files]); } });

render();
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',autoLoad); else autoLoad();
